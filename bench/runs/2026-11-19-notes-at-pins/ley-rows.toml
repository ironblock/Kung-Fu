# Count rows for the 67 merged notes on the animation code of Babylon Lite 1.39.0
# (bench/runs/2026-11-18-animation/notes/merged). Each row name starts with the
# numbers of the notes it serves, as nN. A row points at code or shows a clause;
# for most notes a count cannot show the behaviour, and the run's result says
# which. The rows are checked with `ley check` against a copy of the release's
# packages/babylon-lite/src (release commit 2dddc888f6695e433ab29ae5918bee221375d86f)
# placed as src/ beside this file. Paths in the rows are relative to that src/.

[[row]]
name = "n1 calls of updateAnimationManager"
run = '''ast-grep run -p 'updateAnimationManager($$$A)' -l ts src'''
shows = "every call of the manager update function in src: the only one is in the manager's own requestAnimationFrame loop, so no scene code calls it"

[[row]]
name = "n1 the manager module names no scene"
run = '''rg -n -i -w scene src/animation/animation-manager.ts'''
shows = "lines of the manager module that mention a scene"
count = 0

[[row]]
name = "n2 what createPropertyAnimationGroup does to the new group"
run = '''ast-grep scan --inline-rules '{id: n2, language: ts, rule: {any: [{pattern: "group.loopAnimation = options?.loop ?? true"}, {pattern: "playAnimation(group)"}, {pattern: "addAnimationGroup(manager, group)"}], inside: {kind: function_declaration, has: {field: name, regex: ^createPropertyAnimationGroup$}, stopBy: end}}}' src'''
shows = "the loop default, the play call and the attach call inside createPropertyAnimationGroup"
count = 3

[[row]]
name = "n3 n38 n55 time advanced by milliseconds over 1000"
run = '''ast-grep run -p '$T += ($D / 1000) * $S' -l ts src'''
shows = "every place in src that advances an animation time by the update's milliseconds over 1000, times the speed ratio: the property group, the glTF controller and the two weighted mixers"
count = 4

[[row]]
name = "n3 property group writes at the controller time"
run = '''ast-grep run -p 'applyAt(ctrl.time)' -l ts src'''
shows = "the two places a property group writes its value at the controller's time: after the advance in its tick, and in its seek evaluation"
count = 2

[[row]]
name = "n4 n10 n51 property group stop at the end"
run = '''ast-grep scan --inline-rules '{id: n4, language: ts, rule: {pattern: "if (!ctrl.loop && ctrl.speedRatio >= 0 && ctrl.time >= toTime) { $$$B }", inside: {kind: function_declaration, has: {field: name, regex: ^createPointerAnimationGroup$}, stopBy: end}}}' src'''
shows = "the branch in the property group's tick that ends a non-looping group moving forward"

[[row]]
name = "n5 internal names absent from the package index"
run = '''rg -n -w -e evaluateSampler -e evaluatePropertySampler -e tickAnimationCore -e tickAnimation -e getAnimationGroupOwner -e ANIMATION_GROUP_TASK_CATEGORY src/index.ts'''
shows = "lines of the package index that name any of these internal animation functions or the group task category"
count = 0

[[row]]
name = "n5 n46 interpolation and path constants absent from the package index"
