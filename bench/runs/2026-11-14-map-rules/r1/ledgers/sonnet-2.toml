[[row]]
name = "camera contract"
run = "rg -n \"^export interface Camera\\b\" src/camera"
shows = "the one definition of the Camera interface that every camera type extends and every renderer consumes"
count = 1

[[row]]
name = "camera contract importers"
run = "rg -l \"camera/camera\\.js\" src --glob '!src/camera/**'"
shows = "files outside src/camera that import camera.ts directly, the directory's main inbound dependency"
count = 57

[[row]]
name = "view and projection getters"
run = "rg -n \"^export function (getViewMatrix|getProjectionMatrix|getViewProjectionMatrix|getCameraPosition)\" src/camera/camera.ts"
shows = "the cached matrix getters, defined in camera.ts and not in the per-type files"
count = 4

[[row]]
name = "change key definition"
run = "rg -n \"^export function _cameraChangeKey\" src/camera/camera.ts"
shows = "the polling function that folds fov/near/far drift into a revision, so a projection edit moves the key although worldMatrixVersion does not"
count = 1

[[row]]
name = "change key consumers"
run = "rg -l \"_cameraChangeKey\\(\" src --glob '!src/camera/**'"
shows = "files outside the directory that gate per-frame uploads on the change key"
