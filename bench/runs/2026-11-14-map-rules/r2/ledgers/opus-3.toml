# Ledger for src/camera of Babylon Lite 1.39.0.
#
# A camera here is a plain object that satisfies the `Camera` interface in
# src/camera/camera.ts. It carries its own matrix caches; the free functions
# getViewMatrix / getProjectionMatrix / getViewProjectionMatrix fill them and
# decide when to rebuild them. Controls, limits, keyboard input, orthographic
# projection and fly-to are separate opt-in modules that read and write the
# camera's fields and hook the scene's per-frame list `scene._beforeRender`.

# ---------------------------------------------------------------- Camera contract

[[row]]
name = "camera builders: every object literal that builds a Camera"
run = '''ast-grep scan --inline-rules '{id: camera-literal, language: typescript, rule: {kind: pair, has: {field: key, regex: "^_viewCache$"}}}' src'''
shows = "the object-literal fields that give a new camera its view-matrix cache, one per place in the library that builds a camera by hand, including the XR eye camera and the shadow-light camera outside the camera directory"
count = 5

[[row]]
name = "camera builders: the three src/camera factories derive the world matrix from world-matrix-state"
run = '''ast-grep run -p 'createWorldMatrixState(cameraLocalWorldMatrix)' src/camera'''
shows = "the calls in the ArcRotate, Free and Geospatial factories that hand their local look-at builder to the scene's world-matrix state, which supplies worldMatrix, worldMatrixVersion and parenting"
count = 3

[[row]]
name = "camera builders: right-handed builds flip the look-at basis in each factory"
run = '''ast-grep run -p 'for (const i of [0, 1, 2, 8, 9, 10]) { $$$B }' src'''
shows = "the loops, one per camera factory, that negate the X and Z basis columns of the local matrix when the bundle is built right-handed"
count = 3

[[row]]
name = "camera builders: BankedFreeCamera is a FreeCamera with a caller-owned up vector"
run = '''ast-grep run -p '_createFreeCamera($P, $T, $U)' src'''
shows = "the calls of the shared FreeCamera factory: the plain one passing the fixed world-up constant and the banked one passing its mutable up vector"
count = 2

[[row]]
name = "camera builders: every src/camera factory starts at the same field of view"
run = '''ast-grep scan --inline-rules '{id: fov-default, language: typescript, rule: {kind: pair, has: {field: key, regex: "^fov$"}, not: {has: {field: value, regex: "^0\\.8$"}}}}' src/camera'''
shows = "camera-literal fov defaults in src/camera other than 0.8 radians (none)"
count = 0

[[row]]
name = "camera builders: near-plane defaults differ per factory"
run = '''ast-grep scan --inline-rules '{id: near-default, language: typescript, rule: {kind: pair, has: {field: key, regex: "^nearPlane$"}}}' src/camera'''
shows = "the default nearPlane of each src/camera factory; ArcRotate's differs from Free's and Geospatial's"
count = 3

[[row]]
name = "camera builders: createDefaultCamera overrides the ArcRotate near and far planes"
run = '''ast-grep run -p 'cam.$P = radius * $K' src/scene'''
shows = "the two assignments in the scene's auto-framing camera helper that rescale the near and far clip distances from the framed radius"
count = 2

# ---------------------------------------------------------------- Matrix caches and their keys

[[row]]
name = "matrix cache keys: the view matrix keys on worldMatrixVersion alone"
run = '''ast-grep run -p 'const ver = camera.worldMatrixVersion' src'''
shows = "the cache key line of getViewMatrix"
count = 1

[[row]]
name = "matrix cache keys: projection and view-projection key on _cameraChangeKey"
run = '''ast-grep run -p 'const ver = _cameraChangeKey(camera)' src'''
shows = "the cache key lines of getProjectionMatrix and getViewProjectionMatrix"
count = 2

[[row]]
name = "matrix cache keys: fov, nearPlane and farPlane are polled by value"
run = '''ast-grep run -p 'camera._projFov !== camera.fov || camera._projNear !== camera.nearPlane || camera._projFar !== camera.farPlane' src'''
shows = "the comparison in _cameraChangeKey that detects a projection field write, since those fields are plain data with no setter"
count = 1

[[row]]
name = "matrix cache keys: the projection revision is bumped in two places"
run = '''ast-grep run -p '$C._projRev = ($C._projRev ?? 0) + 1' src'''
shows = "the increments of the projection revision: the poll in camera.ts and the orthographic module's invalidation"
count = 2

[[row]]
name = "matrix cache keys: two cameras outside src/camera inject a matrix and pin its cache to the change key"
run = '''ast-grep run -p '$C.$V = _cameraChangeKey($C)' src'''
shows = "the assignments in the shadow camera and the XR eye camera that store _cameraChangeKey as a cache version so the getters return an injected matrix unchanged"
count = 2

# ---------------------------------------------------------------- Floating origin

[[row]]
name = "floating origin: only the scene writes the camera's floating-origin flag"
run = '''ast-grep run -p '$C._useFloatingOrigin = $V' src'''
shows = "the single assignment of _useFloatingOrigin, inside the scene's per-frame sync"
count = 1

[[row]]
name = "floating origin: getViewMatrix drops the camera translation under the flag"
run = '''ast-grep run -p 'const $C = useFO ? 0 : $W' src/camera'''
shows = "the three translation reads in getViewMatrix that become zero when _useFloatingOrigin is set"
count = 3

[[row]]
name = "frame order: the floating-origin sync runs on both sides of the before-render callbacks"
run = '''ast-grep scan --inline-rules '{id: sandwich, language: typescript, rule: {pattern: "for (const cb of ctx._beforeRender) { $$$B }", follows: {pattern: "syncCameraFloatingOrigin($$$A);", immediate: true}, precedes: {pattern: "syncCameraFloatingOrigin($$$A);", immediate: true}}}' src'''
shows = "the scene loop that walks _beforeRender from head to tail, with a floating-origin sync call directly before and directly after it"
count = 1

# ---------------------------------------------------------------- Per-frame hooks and their order

[[row]]
name = "frame order: onBeforeRender puts user callbacks at the head"
run = '''ast-grep scan --inline-rules '{id: head, language: typescript, rule: {pattern: "$S._beforeRender.unshift($C)", inside: {kind: function_declaration, has: {field: name, regex: "^onBeforeRender$"}, stopBy: end}}}' src'''
shows = "the insertion at the front of the before-render list made by the public onBeforeRender"
count = 1

[[row]]
name = "frame order: src/camera never puts a hook at the head"
run = '''ast-grep run -p '$S._beforeRender.unshift($C)' src/camera'''
shows = "front insertions into the before-render list from src/camera (none)"
count = 0

[[row]]
name = "frame order: the per-frame hooks src/camera appends at the tail"
run = '''ast-grep run -p 'scene._beforeRender.push($F)' src/camera'''
shows = "the per-frame hooks of the ArcRotate, Free, configurable Free and Geospatial controls and of the Geospatial fly-to, each appended so it runs after every onBeforeRender callback"
count = 5

[[row]]
name = "frame hooks: three controls run per frame only when given a scene"
run = '''ast-grep run -p 'if (scene) { scene._beforeRender.push($F); }' src/camera'''
shows = "the guarded registrations in attachControl, attachFreeControl and attachConfigurableFreeControl; without a scene these attach listeners but never apply inertia or movement"
count = 3

[[row]]
name = "frame hooks: the shared interpolation driver retires its slot instead of splicing"
run = '''ast-grep run -p '$L.splice($$$A)' src/animation/frame-interpolation.ts'''
shows = "splice calls in the frame-interpolation driver (none)"
count = 0

[[row]]
name = "frame hooks: the Geospatial fly-to splices its hook out from inside finish"
run = '''ast-grep scan --inline-rules '{id: fly-splice, language: typescript, rule: {pattern: "scene._beforeRender.splice($I, 1)", inside: {kind: function_declaration, has: {field: name, regex: "^finish$"}, stopBy: end}}}' src/camera'''
shows = "the removal of the fly-to driver from the before-render list"
count = 1

[[row]]
name = "frame hooks: the Geospatial fly-to driver calls finish while the scene walks the list"
run = '''ast-grep scan --inline-rules '{id: fly-finish, language: typescript, rule: {pattern: "finish()", inside: {kind: variable_declarator, has: {field: name, regex: "^driver$"}, stopBy: end}}}' src/camera/geospatial-camera-fly.ts'''
shows = "the call of finish from inside the per-frame driver, so the splice happens during the scene's for-of over _beforeRender"
count = 1

# ---------------------------------------------------------------- Orthographic projection

[[row]]
name = "orthographic: the projector seam is installed only by enableOrthographicCamera"
run = '''ast-grep scan --inline-rules '{id: ortho-install, language: typescript, rule: {pattern: "_installOrthographicProjector($F)", not: {inside: {kind: function_declaration, has: {field: name, regex: "^enableOrthographicCamera$"}, stopBy: end}}}}' src'''
shows = "calls of the orthographic installer from anywhere other than enableOrthographicCamera (none)"
count = 0

[[row]]
name = "orthographic: a hand-set camera.ortho is ignored until the projector is installed"
run = '''ast-grep run -p '_orthoProjector !== null && camera.ortho' src'''
shows = "the branch condition in getProjectionMatrix that needs both the installed projector and the camera's ortho bounds"
count = 1

[[row]]
name = "orthographic: disabling clears three projection-cache terms"
run = '''ast-grep scan --inline-rules '{id: ortho-clear, language: typescript, rule: {pattern: "p[$I] = 0", inside: {kind: function_declaration, has: {field: name, regex: "^disableOrthographicCamera$"}, stopBy: end}}}' src/camera'''
shows = "the writes that zero the cache entries the orthographic writer set and the perspective writer leaves alone"
count = 3

# ---------------------------------------------------------------- ArcRotate controls, limits, keyboard

[[row]]
name = "arc-rotate keyboard: the keyboard factory is set only by the installer"
run = '''ast-grep run -p '_arcRotateKeyboardFactory = $F' src'''
shows = "the single assignment of the keyboard factory, in the installer that enableArcRotateKeyboardControls calls"
count = 1

[[row]]
name = "arc-rotate keyboard: attachControl skips the keyboard option when nothing is installed"
run = '''ast-grep run -p '_arcRotateKeyboardFactory?.($$$A)' src/camera'''
shows = "the optional call in attachControl that does nothing with options.keyboard until enableArcRotateKeyboardControls has run"
count = 1

[[row]]
name = "arc-rotate limits: the clamp hook is set by setCameraLimits and cleared by its disposer"
run = '''ast-grep run -p 'camera._clampToLimits = $V' src'''
shows = "the two assignments of the self-clamp hook: installing it and clearing it"
count = 2

[[row]]
name = "arc-rotate limits: alpha, beta and radius setters run the clamp hook"
run = '''ast-grep run -p 'cam._clampToLimits?.()' src/camera'''
shows = "the single call of the clamp hook, in the shared setter the ArcRotate factory defines for alpha, beta and radius"
count = 1

[[row]]
name = "arc-rotate limits: attachControl clamps beta and radius even without limits"
run = '''ast-grep scan --inline-rules '{id: hard-clamp, language: typescript, rule: {any: [{pattern: "camera.beta = Math.max($E, Math.min(Math.PI - $E, camera.beta))"}, {pattern: "camera.radius = Math.max(0.01, camera.radius)"}], inside: {kind: function_declaration, has: {field: name, regex: "^attachControl$"}, stopBy: end}}}' src/camera'''
shows = "the fixed clamps in attachControl: beta kept off the poles in the inertia step, and radius kept above a small floor in both the inertia step and the pinch handler"
count = 3

[[row]]
name = "arc-rotate interpolation: an outside pose change makes the step throw"
run = '''ast-grep run -p 'throw new Error($M)' src/camera/arc-rotate-interpolate.ts'''
shows = "the one throw in the interpolation step, taken when the camera pose differs from the pose the step last wrote"
count = 1

# ---------------------------------------------------------------- Geospatial camera

[[row]]
name = "geospatial: controls and fly-to never assign the orientation fields directly"
run = '''ast-grep scan --inline-rules '{id: geo-direct, language: typescript, rule: {kind: assignment_expression, has: {field: left, regex: "^camera\\.(yaw|pitch|radius|center)$"}}}' src/camera/geospatial-camera-controls.ts src/camera/geospatial-camera-fly.ts'''
shows = "assignments to camera yaw, pitch, radius or center in the Geospatial controls and fly-to (none); they go through the camera's _setOrientation"
count = 0

[[row]]
name = "geospatial: the pitch limit is computed from the radius before the radius is clamped"
run = '''ast-grep scan --inline-rules '{id: geo-order, language: typescript, rule: {pattern: "scalars.pitch = clamp(scalars.pitch, limits.pitchMin, getEffectivePitchMax(limits, scalars.radius));", precedes: {pattern: "scalars.radius = clamp(scalars.radius, limits.radiusMin, limits.radiusMax);"}}}' src/camera'''
shows = "the pitch clamp in applyOrientation, which reads the requested radius and comes before the statement that clamps the radius"
count = 1

[[row]]
name = "geospatial: fly-to's promise only resolves"
run = '''ast-grep run -p 'new Promise<void>((resolve) => $$$B)' src/camera/geospatial-camera-fly.ts'''
shows = "the promise built by flyGeospatialCameraToAsync, whose executor takes no reject; an interrupted flight resolves, unlike interpolateArcRotateCamera"
count = 1

[[row]]
name = "geospatial: a new flight or user input cancels the running flight"
run = '''ast-grep scan --inline-rules '{id: geo-cancel, language: typescript, rule: {any: [{pattern: "camera._cancelFly?.()"}, {pattern: "camera._cancelFly()"}]}}' src/camera'''
shows = "the two cancel calls: at the start of every fly-to and in the Geospatial controls' per-frame tick when input arrives"
count = 2

# ---------------------------------------------------------------- Dependencies and viewports

[[row]]
name = "dependencies: runtime imports from outside math and world-matrix-state"
run = '''ast-grep scan --inline-rules '{id: deps, language: typescript, rule: {kind: import_statement, has: {field: source, regex: "^.\\.\\./"}, all: [{not: {regex: "^import type"}}, {not: {has: {field: source, regex: "math/|world-matrix-state"}}}]}}' src/camera'''
shows = "the value imports src/camera takes from the rest of src other than math and the scene's world-matrix state: the frame-interpolation driver and the picking ray"
count = 2

[[row]]
name = "viewports: the render-pass viewport is not clamped to the target"
run = '''ast-grep scan --inline-rules '{id: no-clamp, language: typescript, rule: {pattern: "clamp01($V)", inside: {kind: function_declaration, has: {field: name, regex: "^_applyCameraViewport$"}, stopBy: end}}}' src/camera'''
shows = "clamps inside _applyCameraViewport, the function render tasks use to set viewport and scissor (none)"
count = 0

[[row]]
name = "viewports: resolveCameraViewport clamps each edge to the target"
run = '''ast-grep scan --inline-rules '{id: clamp, language: typescript, rule: {pattern: "clamp01($V)", inside: {kind: function_declaration, has: {field: name, regex: "^resolveCameraViewport$"}, stopBy: end}}}' src/camera'''
shows = "the four edge clamps in the public pixel-viewport resolver"
count = 4

[[row]]
name = "world-to-screen: only the screen projection validates its options"
run = '''ast-grep run -p 'validateOptions($O)' src/camera'''
shows = "the single validation call, in projectWorldToScreenToRef; projectPointToViewportToRef takes its viewport unchecked"
count = 1
