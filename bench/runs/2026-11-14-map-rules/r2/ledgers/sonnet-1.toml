[[row]]
name = "projection-key: only two places in src increment the projection revision, camera.ts (fov/near/far drift) and orthographic.ts (bounds writes)"
run = "ast-grep run -p '$C._projRev = ($C._projRev ?? 0) + 1' -l ts src"
shows = "an increment of _projRev"
count = 2

[[row]]
name = "projection-key: _cameraChangeKey returns worldMatrixVersion plus _projRev, so a projection change moves the key without moving worldMatrixVersion"
run = "ast-grep run -p 'return camera.worldMatrixVersion + (camera._projRev ?? 0)' -l ts src/camera/camera.ts"
shows = "the return statement of _cameraChangeKey"

[[row]]
name = "projection-key: the projection and view-projection caches are checked against _cameraChangeKey"
run = "ast-grep run -p 'const ver = _cameraChangeKey($C)' -l ts src/camera/camera.ts"
shows = "a version read in getProjectionMatrix or getViewProjectionMatrix"
count = 2

[[row]]
name = "projection-key: the view matrix cache is checked against worldMatrixVersion alone"
run = "ast-grep run -p 'const ver = camera.worldMatrixVersion' -l ts src/camera/camera.ts"
shows = "the version read in getViewMatrix"

[[row]]
name = "projection-key: fov, nearPlane and farPlane writes are detected by comparing against a stored snapshot, not by setters"
run = "ast-grep run -p 'camera._projFov !== camera.fov || camera._projNear !== camera.nearPlane || camera._projFar !== camera.farPlane' -l ts src/camera/camera.ts"
shows = "the comparison inside _cameraChangeKey"

[[row]]
name = "projection-key: the fov snapshot is assigned in two places only, _cameraChangeKey (records it) and scene-core.ts (clears it to undefined when the floating-origin flag flips, so the next key call bumps the revision)"
run = "ast-grep run -p '$C._projFov = $V' -l ts src"
shows = "an assignment to _projFov"
count = 2

[[row]]
name = "projection-key: code outside camera.ts that sets a projection cache version takes it from _cameraChangeKey (xr-camera.ts)"
run = "ast-grep run -p '$C._projVer = _cameraChangeKey($C)' -l ts src"
shows = "an assignment of _projVer from _cameraChangeKey outside camera.ts"

[[row]]
name = "projection-key: code outside camera.ts that sets a view-projection cache version takes it from _cameraChangeKey (shadow-base.ts)"
run = "ast-grep run -p '$C._vpVer = _cameraChangeKey($C)' -l ts src"
shows = "an assignment of _vpVer from _cameraChangeKey outside camera.ts"

[[row]]
name = "projection-key: src/index.ts exports none of the underscore-prefixed camera internals"
run = "rg -n -e _cameraChangeKey -e _applyCameraViewport -e _installOrthographicProjector -e _installArcRotateKeyboardControls -e _createFreeCamera -e _useFloatingOrigin -e _projRev src/index.ts"
shows = "a mention of a camera internal in the public index"
count = 0

[[row]]
name = "ortho: the orthographic projector is installed only from enableOrthographicCamera"
run = "ast-grep run -p '_installOrthographicProjector($F)' -l ts src"
shows = "a call that installs the orthographic projector"

[[row]]
name = "ortho: getProjectionMatrix uses the orthographic writer only when a projector is installed and camera.ortho is set"
run = "ast-grep run -p '_orthoProjector !== null && camera.ortho' -l ts src/camera/camera.ts"
shows = "the branch condition in getProjectionMatrix"

[[row]]
name = "ortho: the bounds setters, enable and disable each bump the revision (four calls)"
run = "ast-grep run -p 'invalidateProjection($C)' -l ts src/camera/orthographic.ts"
shows = "a call to invalidateProjection"
count = 4

[[row]]
name = "ortho: disableOrthographicCamera zeroes three projection cache cells, which the perspective writer does not overwrite"
run = "ast-grep run -p 'p[$N] = 0' -l ts src/camera/orthographic.ts"
shows = "a cache cell set to zero"
count = 3

[[row]]
name = "viewport: render passes get their viewport from _applyCameraViewport, called in two frame-graph tasks"
run = "ast-grep run -p '_applyCameraViewport($$$)' -l ts src"
shows = "a call to _applyCameraViewport"
count = 2

[[row]]
name = "viewport: _applyCameraViewport in camera.ts has no Math.min, so it does not clamp the way resolveCameraViewport does"
run = "ast-grep run -p 'Math.min($$$)' -l ts src/camera/camera.ts"
shows = "a Math.min call in camera.ts"
count = 0

[[row]]
name = "viewport: resolveCameraViewport clamps each of its four edges with clamp01"
run = "ast-grep run -p 'clamp01($X)' -l ts src/camera/viewport.ts"
shows = "a clamp01 call"
count = 4

[[row]]
name = "screen-projection: world-to-screen.ts does not import camera.ts, so callers pass view and view-projection matrices themselves"
run = "ast-grep run -p 'import $$$ from \"./camera.js\"' -l ts src/camera/world-to-screen.ts"
shows = "an import of camera.ts"
count = 0

[[row]]
name = "factories: arc-rotate, free and geospatial cameras each allocate _viewCache with allocateMat4"
run = "ast-grep run -p '{ _viewCache: allocateMat4() as unknown as Mat4Storage }' --selector pair -l ts src/camera"
shows = "a _viewCache allocation in a camera factory"
count = 3

[[row]]
name = "factories: the same three each allocate _projCache with allocateMat4"
run = "ast-grep run -p '{ _projCache: allocateMat4() as unknown as Mat4Storage }' --selector pair -l ts src/camera"
shows = "a _projCache allocation in a camera factory"
count = 3

[[row]]
name = "factories: the same three each allocate _vpCache with allocateMat4"
run = "ast-grep run -p '{ _vpCache: allocateMat4() as unknown as Mat4Storage }' --selector pair -l ts src/camera"
shows = "a _vpCache allocation in a camera factory"
count = 3

[[row]]
name = "factories: the same three each call attachWorldMatrixState on the finished camera"
run = "ast-grep run -p 'attachWorldMatrixState($$$)' -l ts src/camera"
shows = "a call to attachWorldMatrixState in a camera factory"
count = 3

[[row]]
name = "handedness: getViewMatrix and the arc-rotate, free and geospatial local-matrix builders branch on _rightHanded"
run = "ast-grep run -p '_rightHanded !== null' -l ts src/camera"
shows = "a right-handed branch condition"
count = 4

[[row]]
name = "scene-dependency: no runtime import from ../scene in src/camera targets anything but world-matrix-state"
run = "rg -n -e 'import \\{[^}]*\\} from \"(\\./)?\\.\\./scene/[^w]' src/camera"
shows = "a non-type import from a scene module other than world-matrix-state"
count = 0

[[row]]
name = "scene-dependency: the runtime imports of world-matrix-state are in the arc-rotate, free, geospatial and banked free camera files"
run = "rg -n -e 'import \\{[^}]*\\} from \"\\.\\./scene/world-matrix-state' src/camera"
shows = "a runtime import of world-matrix-state"
count = 4

[[row]]
name = "scene-dependency: scene imports one runtime value from camera, createArcRotateCamera in scene-camera.ts"
run = "ast-grep run -p 'import { $$$ } from \"../camera/arc-rotate.js\"' -l ts src/scene"
shows = "a runtime import from the arc-rotate camera module"

[[row]]
name = "controls: arc-rotate, free, configurable free and geospatial controls and the geospatial fly driver each push their per-frame work onto scene._beforeRender"
run = "ast-grep run -p 'scene._beforeRender.push($F)' -l ts src/camera"
shows = "a push onto scene._beforeRender"
count = 5

[[row]]
name = "controls: the same five each remove that work from scene._beforeRender with splice"
run = "ast-grep run -p 'scene._beforeRender.splice($$$)' -l ts src/camera"
shows = "a splice of scene._beforeRender"
count = 5

[[row]]
name = "arc-rotate limits: the alpha/beta/radius setters call an optional _clampToLimits hook, which is undefined until setCameraLimits runs"
run = "ast-grep run -p 'cam._clampToLimits?.()' -l ts src"
shows = "the optional hook call in arc-rotate.ts"

[[row]]
name = "arc-rotate limits: _clampToLimits is assigned only in arc-rotate-controls.ts, once to install and once to clear on dispose"
run = "ast-grep run -p '$C._clampToLimits = $V' -l ts src"
shows = "an assignment to _clampToLimits"
count = 2

[[row]]
name = "arc-rotate keyboard: attachControl reads the keyboard factory with an optional call, so keyboard input does nothing until a factory is installed"
run = "ast-grep run -p '_arcRotateKeyboardFactory?.($$$)' -l ts src"
shows = "the optional call of the keyboard factory"

[[row]]
name = "arc-rotate keyboard: the factory is installed only from arc-rotate-keyboard-controls.ts (enableArcRotateKeyboardControls)"
run = "ast-grep run -p '_installArcRotateKeyboardControls($F)' -l ts src"
shows = "a call that installs the keyboard factory"

[[row]]
name = "arc-rotate keyboard: no file in src has a runtime import of the keyboard module (arc-rotate-controls.ts imports only its option type), so keyboard code is bundled only if a caller imports it to call enableArcRotateKeyboardControls"
run = "ast-grep run -p 'import { $$$ } from \"./arc-rotate-keyboard-controls.js\"' -l ts src"
shows = "a value import of the keyboard module"
count = 0

[[row]]
