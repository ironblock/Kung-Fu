# Ledger for src/camera (Babylon Lite 1.39.0).
# A camera here is plain data plus free functions: factories build it, `get*Matrix`
# read it through caches, and separate `attach*` / `enable*` modules add input,
# limits, keyboard and orthographic projection only when imported.

# ---- factory: what every camera factory has to do -------------------------

[[row]]
name = "factory-caches"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {kind: pair, all: [{has: {field: key, regex: "^_(view|proj|vp)Cache$"}}, {has: {field: value, pattern: "allocateMat4() as unknown as Mat4Storage"}}]}}' src/camera'''
shows = "the three matrix cache fields in each of the three camera factories (arc-rotate, free, geospatial), every one taken from the process-global matrix allocator, so the cache precision is fixed when the camera is built"
count = 9

[[row]]
name = "factory-world-matrix-state"
run = '''ast-grep run -p 'createWorldMatrixState(cameraLocalWorldMatrix)' src/camera'''
shows = "each of the three camera factories handing its local-matrix builder to the scene module's world-matrix state"
count = 3

[[row]]
name = "factory-right-handed-mirror"
run = '''ast-grep run -p 'for (const i of [0, 1, 2, 8, 9, 10]) { $$$ }' src/camera'''
shows = "the right-handed axis flip, copied by hand into each of the three camera factories rather than shared"
count = 3

# ---- cache: how the matrix getters decide to recompute --------------------

[[row]]
name = "cache-key-projection"
run = '''ast-grep run -p 'const ver = _cameraChangeKey(camera)' src/camera'''
shows = "the two getters (projection and view-projection) that key their cache on the change key; the view getter alone keys on the transform version"
count = 2

[[row]]
name = "cache-key-sum"
run = '''ast-grep run -p 'return camera.worldMatrixVersion + (camera._projRev ?? 0)' src'''
shows = "the change key, the sum of the transform version and a separate projection revision"
count = 1

[[row]]
name = "cache-version-writers-outside"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {any: [{pattern: "$C._viewVer = $V"}, {pattern: "$C._projVer = $V"}, {pattern: "$C._vpVer = $V"}]}}' --globs '!src/camera/**' src'''
shows = "writes to a camera's cache-version fields made outside src/camera, by the scene, shadow and XR modules"
count = 6

# ---- proj: projection revision and the orthographic opt-in ----------------

[[row]]
name = "proj-rev-writers"
run = '''ast-grep run -p '$C._projRev = ($C._projRev ?? 0) + 1' src'''
shows = "every place in src that advances the projection revision: the polled fov/near/far check in camera.ts and the orthographic module's invalidation"
count = 2

[[row]]
name = "proj-ortho-installer"
run = '''ast-grep run -p '_installOrthographicProjector($F)' src'''
shows = "the only call that installs the orthographic projection writer, made by the orthographic module's enable function"
count = 1

[[row]]
name = "proj-ortho-gate"
run = '''ast-grep run -p 'if (_orthoProjector !== null && camera.ortho) { $$$ }' src/camera'''
shows = "the projection getter's orthographic branch, taken only when a writer has been installed and the camera's bounds field is set"
count = 1

[[row]]
name = "proj-ortho-assign"
run = '''ast-grep run -p '$X.ortho = $V' src'''
shows = "every assignment of a camera's orthographic bounds field in src, both inside the orthographic module's enable and disable functions"
count = 2

# ---- fo: floating origin ----------------------------------------------------

[[row]]
name = "fo-flag-writer"
run = '''ast-grep run -p '$C._useFloatingOrigin = $V' src'''
shows = "the one assignment of the camera's floating-origin flag, made by the scene module and not by any camera code"
count = 1

# ---- order: the scene's per-frame queue that all camera input runs on -----

[[row]]
name = "order-user-at-head"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "$S._beforeRender.unshift($F)", inside: {kind: function_declaration, has: {field: name, regex: "^onBeforeRender$"}, stopBy: end}}}' src/scene'''
shows = "the public before-render registration putting its callback at the head of the scene's per-frame queue"
count = 1

[[row]]
name = "order-camera-at-tail"
run = '''ast-grep run -p '$S._beforeRender.push($F)' src/camera'''
shows = "the camera modules (arc-rotate, free, configurable free and geospatial controls, geospatial fly) putting their per-frame work at the tail of the scene's queue"
count = 5

[[row]]
name = "order-camera-never-head"
run = '''ast-grep run -p '$S._beforeRender.unshift($F)' src/camera'''
shows = "camera modules putting work at the head of the scene's queue"
count = 0

[[row]]
name = "order-walk"
run = '''ast-grep run -p 'for (const cb of ctx._beforeRender) { $$$ }' src/scene'''
shows = "the scene update walking its per-frame queue from head to tail with a live for-of loop"
count = 1

[[row]]
name = "order-scene-optional"
run = '''ast-grep run -p 'if (scene) { scene._beforeRender.push($F) }' src/camera'''
shows = "the three control functions (arc-rotate, free, configurable free) that register their per-frame inertia only when a scene argument is passed"
count = 3

# ---- arc: arc-rotate camera, limits, keyboard, interpolation --------------

[[row]]
name = "arc-limits-hook-call"
run = '''ast-grep run -p 'cam._clampToLimits?.()' src/camera'''
shows = "the arc-rotate scalar setters calling an optional limit hook after every changed value"
count = 1

[[row]]
name = "arc-limits-hook-writers"
run = '''ast-grep run -p '$C._clampToLimits = $V' src'''
shows = "every write of that limit hook in src, the install and the removal, both in the limit-setting function"
count = 2

[[row]]
name = "arc-beta-hard-clamp"
run = '''ast-grep run -p 'camera.beta = Math.max(eps, Math.min(Math.PI - eps, camera.beta))' src/camera'''
shows = "the per-frame inertia step clamping elevation just inside zero and pi on its own, whether or not limits are set"
count = 1

[[row]]
name = "arc-target-observable"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {kind: pair, all: [{has: {field: key, regex: "^target$"}}, {has: {field: value, pattern: "new ObservableVec3($$$A) as unknown as Vec3"}}]}}' src/camera'''
shows = "the arc-rotate factory filling the target with an observable vector whose setters mark the matrix dirty, cast down to a plain vector type"
count = 1

[[row]]
name = "arc-target-writable"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {kind: property_signature, regex: "^target: Vec3$", inside: {kind: interface_declaration, has: {field: name, regex: "^ArcRotateCamera$"}, stopBy: end}}}' src/camera'''
shows = "the arc-rotate interface declaring the target as a writable plain vector, so the type does not stop the observable from being replaced"
count = 1

[[row]]
name = "arc-keyboard-installer"
run = '''ast-grep run -p '_installArcRotateKeyboardControls($F)' src'''
shows = "the only call that installs the arc-rotate keyboard factory, made by the opt-in keyboard module's enable function"
count = 1

[[row]]
name = "arc-keyboard-read-at-attach"
run = '''ast-grep run -p 'const keyboardAttachment = _arcRotateKeyboardFactory?.($$$A)' src/camera'''
shows = "the attach function reading the keyboard factory once, when it is called, so an install made after attaching is not seen"
count = 1

[[row]]
name = "arc-keyboard-in-inertia"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "keyboardAttachment?.[0]()", inside: {kind: function_declaration, has: {field: name, regex: "^applyInertia$"}, stopBy: end}}}' src/camera'''
shows = "keyboard input applied from inside the per-frame inertia step, so it runs only when that step was registered with a scene"
count = 1

[[row]]
name = "arc-interp-driver"
run = '''ast-grep run -p 'runFrameInterpolation($$$A)' src/camera'''
shows = "the arc-rotate interpolation running on the animation module's shared frame driver"
count = 1

[[row]]
name = "arc-interp-throws"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "throw $E", inside: {kind: variable_declarator, has: {field: name, regex: "^step$"}, stopBy: end}}}' src/camera'''
shows = "the interpolation step throwing when something else moved the camera between frames"
count = 1

[[row]]
name = "driver-retires-in-place"
run = '''ast-grep run -p 'list[index] = RetiredDriver' src/animation'''
shows = "the shared frame driver replacing its finished slot in the scene queue with a no-op"
count = 1

[[row]]
name = "driver-never-splices"
run = '''ast-grep run -p '$L.splice($$$A)' src/animation/frame-interpolation.ts'''
shows = "array splices in the shared frame driver's file"
count = 0

# ---- geo: geospatial camera, controls and fly-to ----------------------------

[[row]]
name = "geo-fly-splice-in-finish"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "$S._beforeRender.splice($I, 1)", inside: {kind: function_declaration, has: {field: name, regex: "^finish$"}, stopBy: end}}}' src/camera'''
shows = "the geospatial fly-to finishing by splicing its driver out of the scene queue, unlike the shared frame driver"
count = 1

[[row]]
name = "geo-fly-finish-from-driver"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "finish()", inside: {kind: variable_declarator, has: {field: name, regex: "^driver$"}, stopBy: end}}}' src/camera/geospatial-camera-fly.ts'''
shows = "the fly-to finish being called from inside the fly-to driver itself, that is, during the scene's walk of its queue"
count = 1

[[row]]
name = "geo-fly-resolve-only"
run = '''ast-grep run -p 'new Promise<void>((resolve) => $B)' src/camera'''
shows = "the fly-to promise built with a resolve callback and no reject"
count = 1

[[row]]
name = "geo-fly-cancelled-by-input"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "$C._cancelFly()", inside: {kind: function_declaration, has: {field: name, regex: "^onBeforeRenderTick$"}, stopBy: end}}}' src/camera'''
shows = "the geospatial controls' per-frame tick calling the cancel of an in-flight fly-to"
count = 1

[[row]]
name = "geo-pitch-limit-by-radius"
run = '''ast-grep run -p 'scalars.pitch = clamp(scalars.pitch, limits.pitchMin, getEffectivePitchMax(limits, scalars.radius))' src/camera'''
shows = "the geospatial orientation update clamping pitch to an upper bound that depends on the current radius"
count = 1

[[row]]
name = "geo-inertia-fixed"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {kind: lexical_declaration, has: {kind: variable_declarator, has: {field: name, regex: "Inertia$"}}, inside: {kind: function_declaration, has: {field: name, regex: "^attachGeospatialControls$"}, stopBy: end}}}' src/camera'''
shows = "the geospatial controls' three inertia values, local constants rather than options or camera fields"
count = 3

[[row]]
name = "geo-keys-on-window"
run = '''ast-grep run -p '[window, $E, $H]' src/camera'''
shows = "the geospatial controls' key listeners, attached to the window rather than to the canvas"
count = 2

# ---- free: free camera and its two control functions ------------------------

[[row]]
name = "free-target-rewritten"
run = '''ast-grep run -p 'camera.target.set($$$A)' src/camera'''
shows = "the two free-camera control functions rebuilding the target from yaw and pitch"
count = 2

[[row]]
name = "free-controls-not-shared"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {kind: import_statement, has: {kind: string, regex: "free-camera-controls"}}}' src/camera'''
shows = "imports of the plain free-camera controls module from within src/camera, which the configurable controls do not reuse"
count = 0

# ---- dep: what src/camera takes from the rest of src ------------------------

[[row]]
name = "dep-scene-types-only"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {kind: import_statement, not: {regex: "^import type"}, has: {kind: string, regex: "scene/scene(-core)?\\.js"}}}' src/camera'''
shows = "value (non-type) imports of the scene module from src/camera, where camera code knows the scene only as a type"
count = 0

# ---- view: two different viewport conversions -------------------------------

[[row]]
name = "view-resolve-clamps"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {pattern: "clamp01($X)", inside: {kind: function_declaration, has: {field: name, regex: "^resolveCameraViewport$"}, stopBy: end}}}' src/camera'''
shows = "the public viewport resolver clamping all four edges into the unit range"
count = 4

[[row]]
name = "view-render-pass-no-clamp"
run = '''ast-grep scan --inline-rules '{id: c, language: typescript, rule: {any: [{pattern: "clamp01($X)"}, {pattern: "Math.max($$$A)"}, {pattern: "Math.min($$$A)"}], inside: {kind: function_declaration, has: {field: name, regex: "^_applyCameraViewport$"}, stopBy: end}}}' src/camera'''
shows = "clamping calls inside the internal function that sets the render-pass viewport and scissor from the same normalized viewport, which does not clamp"
count = 0
