[[row]]
name = "arc-rotate-note"
is = "Limits and keyboard are opt-in. setCameraLimits stores bounds and installs a hook that the alpha, beta and radius setters call, so limits hold at every write instead of once per frame. Keyboard input is built inside attachControl from whatever factory is installed at that moment, so enableArcRotateKeyboardControls must run before attachControl or the keyboard option does nothing"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

