[[row]]
name = "viewport-note"
is = "There are two separate conversions from normalized viewport to pixels. _applyCameraViewport in camera.ts sets the render-pass viewport and scissor with no clamping; resolveCameraViewport in viewport.ts clamps to the target and is used by picking and gizmo code. A viewport reaching outside the target gives different rectangles from each"
