[[row]]
name = "ortho-disable-clears-cache"
run = "ast-grep scan --inline-rules '{id: a, language: ts, rule: {pattern: \"$P[$I] = 0\", inside: {kind: function_declaration, has: {field: name, regex: \"^disableOrthographicCamera$\"}, stopBy: end}}}' src/camera/orthographic.ts"
shows = "zero assignments to an index of a matrix cache inside disableOrthographicCamera"
count = 3

[[row]]
name = "ortho-note"
is = "Orthographic support is wired in at run time: enableOrthographicCamera installs the projection writer into camera.ts, and getProjectionMatrix uses it only when it is installed and camera.ortho is set. Without an enable call a bundle carries no orthographic code. Disabling must clear three cache entries (indices 12, 13, 15) because the perspective writer writes only the terms it needs and would leave the orthographic values behind. It works with any Camera, whatever its type"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "rh-matrix-branch"
run = "ast-grep run -l ts -p 'if (_rightHanded !== null) { $$$B }' src/camera"
shows = "if-statements testing _rightHanded against null (the view matrix and three camera local matrices)"
count = 4

[[row]]
name = "rh-alias-only"
run = "rg -n -e '[./]coordinate-system' src/camera"
shows = "import paths in src/camera that reach coordinate-system by a path other than the #coordinate-system alias"
count = 0

[[row]]
name = "rh-note"
is = "Handedness is applied in two ways. Matrix code (getViewMatrix and each camera factory's local matrix) tests _rightHanded !== null and negates matrix entries. The pointer and key controls use _rightHanded as a truthy flag and negate inputs. A new camera type or control needs the matching treatment or right-handed scenes will move the wrong way"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

