[[row]]
name = "camera-contract-note"
is = "Camera is plain data: whoever builds one supplies the three matrix caches from allocateMat4() and a worldMatrix whose version never goes backwards. src/camera has three factories; xr-camera.ts and shadow-base.ts build their own. Cameras hold no scene reference; controls take the scene as an argument"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

