[[row]]
name = "change-key-sum"
run = "ast-grep run -l ts -p 'return $C.worldMatrixVersion + ($C._projRev ?? 0)' src/camera"
shows = "return statements that sum the camera's worldMatrixVersion with _projRev"
count = 1

[[row]]
name = "change-key-projection-caches"
run = "ast-grep run -l ts -p 'const $V = _cameraChangeKey($C)' src/camera/camera.ts"
shows = "declarations in camera.ts that take a camera's change key (the projection and view-projection caches)"
count = 2

[[row]]
name = "change-key-view-cache"
run = "ast-grep run -l ts -p 'const $V = $C.worldMatrixVersion' src/camera/camera.ts"
shows = "declarations in camera.ts that read worldMatrixVersion directly (the view matrix cache)"
count = 1

[[row]]
name = "change-key-polled-fields"
run = "ast-grep run -l ts -p 'if ($C._projFov !== $C.fov || $C._projNear !== $C.nearPlane || $C._projFar !== $C.farPlane) { $$$B }' src/camera"
shows = "if-statements comparing the _projFov, _projNear and _projFar snapshots with fov, nearPlane and farPlane"
count = 1

[[row]]
name = "change-key-writers"
run = "ast-grep run -l ts -p '$C._projRev = $X' src/camera"
shows = "assignments to _projRev inside src/camera, in camera.ts and orthographic.ts"
count = 2

[[row]]
name = "change-key-reset-by-scene"
run = "ast-grep run -l ts -p '$C._projFov = undefined' src"
shows = "assignments anywhere in src that clear the _projFov snapshot"
count = 1

[[row]]
name = "change-key-note"
is = "A projection change does not move worldMatrixVersion, so a per-frame consumer that skips work by camera version must use _cameraChangeKey (worldMatrixVersion plus _projRev) instead. fov, nearPlane and farPlane are plain fields: _cameraChangeKey notices a write only when it is called and finds the values differ from its snapshot. Orthographic bounds push their change into _projRev instead. The sum is safe only because worldMatrixVersion never decreases, so a hand-written Camera must keep that too. The scene clears _projFov to force the next key read to bump _projRev"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "floating-origin-reader"
run = "ast-grep run -l ts -p '$C._useFloatingOrigin' src/camera"
shows = "reads of _useFloatingOrigin inside src/camera (getViewMatrix)"
count = 1

[[row]]
name = "floating-origin-writer"
run = "ast-grep run -l ts -p '$C._useFloatingOrigin = $X' src"
shows = "assignments to _useFloatingOrigin anywhere in src (scene-core.ts)"
count = 1

[[row]]
name = "floating-origin-note"
is = "The camera code never sets _useFloatingOrigin. The scene copies its engine's mode onto the active camera, also resetting _viewVer and _projFov, so a camera moved to another engine gets a different view matrix next frame. When the flag is set the view translation column is zero"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

