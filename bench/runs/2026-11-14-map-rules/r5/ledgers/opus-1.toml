[[row]]
name = "free camera: controls rewrite target from _pitch"
run = "ast-grep run -l ts -p '$C.target.set($X, $C.position.y + Math.sin($C._pitch), $Z)' src/camera"
shows = "the target.set calls that rebuild the target from position and _pitch, one in each free-camera control module"
count = 2

[[row]]
name = "free camera: yaw and pitch go stale"
is = "A FreeCamera's view comes from position and target (and up, for the banked one). _yaw and _pitch are set from the target direction once, in _createFreeCamera. After that only the control modules change them, by adding to them, and nothing reads them back from target. If you set camera.target by hand while controls are attached, the next turn or move rebuilds target from the old _yaw/_pitch and the view jumps back. Keep _yaw and _pitch in step yourself, or set the view through the controls only. The controls also clamp _pitch to within 0.01 of ±π/2"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

