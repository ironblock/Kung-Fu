[[row]]
name = "geospatial: change it through orientation"
is = "ArcRotateCamera.target and FreeCamera.position/target are ObservableVec3, so camera.target.x = 1 marks the world matrix dirty. On a GeospatialCamera, center, position and upVector are plain objects. Writing camera.center.x changes the stored centre without recomputing position or the matrix, and the next orientation change then treats the edited value as the centre. Assign a whole new camera.center, set yaw, pitch or radius, or call setGeospatialOrientation. Every such change goes through one internal recompute that wraps the angles, clamps them and radius to camera.limits, and keeps the centre off the poles. Changes to camera.limits take effect only at the next such change"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

