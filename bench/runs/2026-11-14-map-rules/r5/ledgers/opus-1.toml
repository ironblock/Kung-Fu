shows = "the one look-at build that takes the camera's position and target fields, in free-camera.ts"

[[row]]
name = "free camera: _yaw is written only by += in controls"
run = "ast-grep scan --inline-rules '{id: yaw-write, language: ts, rule: {any: [{pattern: \"$C._yaw = $V\"}, {pattern: \"$C._yaw += $V\"}, {pattern: \"$C._yaw -= $V\"}]}}' src"
shows = "every write to a camera's _yaw field in src, each a += in one of the two free-camera control modules"
