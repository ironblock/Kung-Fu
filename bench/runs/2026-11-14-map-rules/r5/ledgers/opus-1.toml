[[row]]
name = "viewport: two copies of the pixel rectangle"
is = "camera.viewport is Babylon-style: fractions of the render target, with y measured from the bottom. Two functions turn it into pixels. _applyCameraViewport in camera.ts is what the render tasks call before they draw. resolveCameraViewport in viewport.ts is what callers pass to projectWorldToScreen. They do the same floor/ceil math, but only resolveCameraViewport clamps to [0, 1] and keeps width and height non-negative. For a viewport that runs off the target, what is drawn and what world-to-screen reports can differ. projectWorldToScreenToRef also checks its options and throws RangeError, and projectPointToViewportToRef does not"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]
