[[row]]
name = "two-viewport-routines"
is = "Two separate routines turn a normalized camera viewport into pixels, and they are not the same: resolveCameraViewport (viewport.ts, public) clamps to the target and returns a PixelViewport, while _applyCameraViewport (camera.ts, internal) sets the render pass viewport and scissor itself without clamping. Both flip y from the bottom-origin Babylon convention to the top-origin WebGPU one. An out-of-range viewport can therefore behave differently when rendering and when picking"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

