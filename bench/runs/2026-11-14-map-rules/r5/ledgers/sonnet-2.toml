[[row]]
name = "geospatial-layering"
is = "The geospatial camera is split into layers: geospatial-camera.ts is state plus basis math, geospatial-limits.ts and geospatial-movement.ts are pure helpers, fly and controls sit on top, and nothing inside src/camera imports controls. Outside src/camera, the geospatial controls need the picking ray code and the arc-rotate interpolation needs frame interpolation; the rest needs only math and scene types. The geospatial camera is centred on the planet origin, so planet radius is a creation argument"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]
