shows = "conditionals on the right-handed flag"
count = 4

[[row]]
name = "handedness"
is = "Matrices are built left-handed and flipped afterwards when the right-handed build flag is on: the view matrix mirrors Z, and each factory negates the local basis columns. The control modules do not touch matrices; they flip input deltas (yaw, pan, strafe) with a ternary on _rightHanded instead. A change of handedness behaviour therefore has to be made in both places, the matrix building and the control input"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

