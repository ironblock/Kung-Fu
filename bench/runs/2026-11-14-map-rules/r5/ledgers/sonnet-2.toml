[[row]]
name = "camera-is-a-contract"
is = "Camera is an interface that anything can satisfy, and src/camera does not own every implementation: the three factories here (arc-rotate, free, geospatial) build plain objects with their own matrix caches, and the XR and shadow code outside the directory build more. Code that takes a Camera must therefore go through getViewMatrix, getProjectionMatrix and getViewProjectionMatrix and must not assume a camera was made by one of these factories. The caches are allocated with allocateMat4 at construction, so their storage precision (F32 or F64) is fixed when the camera is made"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

