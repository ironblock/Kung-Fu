[[row]]
name = "change-key-meaning"
is = "The camera's view matrix is cached by worldMatrixVersion alone, but the projection and view-projection caches are cached by _cameraChangeKey, which adds a separate projection revision to worldMatrixVersion. fov, nearPlane and farPlane are plain fields that cannot notify anyone, so _cameraChangeKey compares them with a last-seen copy each time it is called and bumps the revision on a difference; the orthographic setters bump it directly. Anything outside src/camera that caches GPU uploads per camera must key on _cameraChangeKey and not on worldMatrixVersion, or a fov or ortho-bounds change will not reach the GPU. The sum only works because worldMatrixVersion never decreases, which any hand-made Camera must also honour"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

