[[row]]
name = "free-banked-split"
is = "createFreeCamera and createBankedFreeCamera are the same factory with a different up argument. The factory reads up on every rebuild of the local matrix, so a banked camera rolls just by writing its upVector, whose callback marks the matrix dirty. The roll code lives only in banked-free-camera.ts and the plain free camera pays nothing for it"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

