[[row]]
name = "arc-limits"
is = "The arc-rotate camera is plain data whose alpha, beta and radius are accessors: a changed value marks the world matrix dirty and then calls _clampToLimits if present. setCameraLimits is what installs that hook and its returned function removes it, so limits are enforced on every write, including pinch and inertia, only while limits are installed. A bound applies only when set, and hitting one zeroes the matching inertial offset"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

