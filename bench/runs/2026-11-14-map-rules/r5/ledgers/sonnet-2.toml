[[row]]
name = "late-install-seams"
is = "Two features are wired in through a module-level setter instead of an import: orthographic projection (the projector is installed by enableOrthographicCamera and read in camera.ts only when it is not null) and arc-rotate keyboard input (installed by enableArcRotateKeyboardControls, used by attachControl). The tests beside this note show the shape: the reading side holds a nullable module variable, the feature module holds the only install call, and the reading side imports the feature module only as a type. The order that follows is that enableOrthographicCamera must run before the first projection is read, and enableArcRotateKeyboardControls must run before attachControl is called with keyboard, or the option is silently ignored. A bundle that never imports the feature drops it"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

