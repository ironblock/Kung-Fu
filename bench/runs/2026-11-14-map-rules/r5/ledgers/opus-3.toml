[[row]]
name = "viewport: what it means"
is = "camera.viewport is Babylon-style: fractions of the target with y measured from the bottom. Two functions turn it into pixels. _applyCameraViewport in camera.ts, used by the render tasks in src/frame-graph, does not clamp. resolveCameraViewport in viewport.ts, used by GPU picking and gizmo pointer drag, clamps every edge to [0, 1]. Inside [0, 1] they agree; a viewport that reaches past the target edge is drawn in one rectangle and picked in another"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

