run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "_installArcRotateKeyboardControls($F)", inside: {kind: function_declaration, has: {field: name, regex: "^enableArcRotateKeyboardControls$"}, stopBy: end}}}' src'''
