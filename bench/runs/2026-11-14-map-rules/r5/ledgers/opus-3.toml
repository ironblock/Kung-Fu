# Ledger for src/camera (Babylon Lite 1.39.0).
# Row names that begin alike are about one thing; a note follows the tests it leans on.

[[row]]
name = "projection key: the sum"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "return $C.worldMatrixVersion + ($C._projRev ?? 0)", inside: {kind: function_declaration, has: {field: name, regex: "^_cameraChangeKey$"}, stopBy: end}}}' src/camera'''
shows = "the one return statement of _cameraChangeKey in camera.ts: the transform version plus the projection revision"
count = 1

[[row]]
name = "projection key: polled lens fields"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "if ($C._projFov !== $C.fov || $C._projNear !== $C.nearPlane || $C._projFar !== $C.farPlane) { $$$ }", inside: {kind: function_declaration, has: {field: name, regex: "^_cameraChangeKey$"}, stopBy: end}}}' src/camera'''
shows = "the comparison inside _cameraChangeKey of the last-seen snapshot against fov, near plane and far plane, guarding the revision bump"
count = 1

[[row]]
name = "projection key: callers in camera.ts"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "_cameraChangeKey($C)", inside: {kind: function_declaration, has: {field: name, regex: "^get(View)?ProjectionMatrix$"}, stopBy: end}}}' src/camera'''
shows = "the calls to the change key from the projection getter and the view-projection getter, one each"
count = 2

[[row]]
name = "projection key: revision writers in src/camera"
run = '''ast-grep run -l ts -p '$C._projRev = $X' src/camera'''
shows = "every assignment to a camera's projection revision in the camera directory: one in the change key, one in the orthographic module's invalidator"
count = 2

[[row]]
name = "projection key: orthographic invalidations"
run = '''ast-grep run -l ts -p 'invalidateProjection($C)' src/camera'''
shows = "the calls of the orthographic invalidator: the halfHeight setter, the shared plane setter, enable, and disable"
count = 4

[[row]]
name = "projection key: what it means"
is = "A camera's matrices and every per-frame GPU upload that depends on them (scene UBO, text, CSM, TAA, clustered lights, ...) are keyed on _cameraChangeKey, not on worldMatrixVersion alone. fov, nearPlane and farPlane are plain fields: a write notifies nobody and is only seen when the key is next polled. Orthographic bounds are the other way round: the accessor objects built by enableOrthographicCamera bump _projRev on write. So assigning camera.ortho to a plain object of your own, instead of calling enableOrthographicCamera, changes nothing the key looks at, and the old projection stays cached. A hand-written Camera must keep worldMatrixVersion non-decreasing, or the summed key can repeat an old value and a change is missed"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "floating origin: the one writer"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {any: [{pattern: "$C._useFloatingOrigin = $X"}, {kind: pair, has: {field: key, regex: "^_useFloatingOrigin$"}}], inside: {kind: function_declaration, has: {field: name, regex: "^syncCameraFloatingOrigin$"}, stopBy: end}}}' src'''
shows = "the write of a camera's floating-origin flag inside the scene's sync function in scene-core.ts"
count = 1

[[row]]
name = "floating origin: no other writer"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {any: [{pattern: "$C._useFloatingOrigin = $X"}, {kind: pair, has: {field: key, regex: "^_useFloatingOrigin$"}}], not: {inside: {kind: function_declaration, has: {field: name, regex: "^syncCameraFloatingOrigin$"}, stopBy: end}}}}' src'''
shows = "writes of the floating-origin flag, by assignment or in an object literal, anywhere in src outside the scene's sync function: none"
count = 0

[[row]]
name = "floating origin: re-arming the key"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "$C._projFov = undefined", inside: {kind: function_declaration, has: {field: name, regex: "^syncCameraFloatingOrigin$"}, stopBy: end}}}' src'''
shows = "the reset of the camera's fov snapshot inside the scene's floating-origin sync, which forces the change key to move"
count = 1

[[row]]
name = "frame order: onBeforeRender goes to the head"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "$S._beforeRender.unshift($X)", inside: {kind: function_declaration, has: {field: name, regex: "^onBeforeRender$"}, stopBy: end}}}' src'''
shows = "the public onBeforeRender helper inserting its callback at the front of the scene's per-frame list"
count = 1

[[row]]
name = "frame order: camera hooks go to the tail"
run = '''ast-grep run -l ts -p '$S._beforeRender.push($X)' src/camera'''
shows = "the camera modules appending their per-frame hook to the end of the scene's list: arc-rotate controls, the two free-camera controls, geospatial controls, geospatial fly"
count = 5

[[row]]
name = "frame order: no camera hook at the head"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {any: [{pattern: "$S._beforeRender.unshift($$$)"}, {pattern: "onBeforeRender($$$)"}]}}' src/camera'''
shows = "places in the camera directory that insert at the front of the per-frame list, directly or through the public helper: none"
count = 0

[[row]]
name = "frame order: the list is run front to back"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "for (const $CB of $S._beforeRender) { $$$ }", inside: {kind: method_definition, has: {field: name, regex: "^_update$"}, stopBy: end}}}' src/scene'''
shows = "the for-of loop in the scene context's per-frame update that walks the per-frame list in order"
count = 1

[[row]]
name = "frame order: what it means"
is = "Every callback a user adds with onBeforeRender runs, in each frame, before every camera control, interpolation and geospatial flight, whatever order they were registered in. A callback that reads the camera pose sees it before this frame's inertia is applied; one that writes alpha, radius or position has inertia and input added on top later in the same frame. The scene's _update also re-syncs the camera's floating-origin flag both before and after walking this list, so a callback may swap scene.camera"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "transitions: arc-rotate uses the shared driver"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "return runFrameInterpolation($S, $F, $G)", inside: {kind: function_declaration, has: {field: name, regex: "^interpolateArcRotateCamera$"}, stopBy: end}}}' src/camera'''
shows = "interpolateArcRotateCamera handing its step function to the animation directory's frame-interpolation driver"
count = 1

[[row]]
name = "transitions: shared driver retires in place"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "$L[$I] = RetiredDriver", inside: {kind: function_declaration, has: {field: name, regex: "^runFrameInterpolation$"}, stopBy: end}}}' src/animation'''
shows = "the frame-interpolation driver overwriting its own slot in the list with a no-op instead of removing it"
count = 1

[[row]]
name = "transitions: arc-rotate throws on interference"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "throw new Error($M)", inside: {kind: function_declaration, has: {field: name, regex: "^interpolateArcRotateCamera$"}, stopBy: end}}}' src/camera'''
shows = "the one throw inside interpolateArcRotateCamera's step"
count = 1

[[row]]
name = "transitions: geospatial fly splices itself out"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "$S._beforeRender.splice($$$)", inside: {kind: function_declaration, has: {field: name, regex: "^flyGeospatialCameraToAsync$"}, stopBy: end}}}' src/camera'''
shows = "the geospatial flight removing its driver from the per-frame list by splicing, inside flyGeospatialCameraToAsync"
count = 1

[[row]]
name = "transitions: geospatial fly cannot reject"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "new Promise<void>(($R) => { $$$ })", inside: {kind: function_declaration, has: {field: name, regex: "^flyGeospatialCameraToAsync$"}, stopBy: end}}}' src/camera'''
shows = "the promise flyGeospatialCameraToAsync returns, built from an executor that takes one parameter only"
count = 1

[[row]]
name = "transitions: what it means"
is = "The two camera transitions end differently when interrupted. interpolateArcRotateCamera rejects its promise when anything else moves the camera between frames (a drag, leftover inertia, a direct write, a newer interpolation), so callers must catch. flyGeospatialCameraToAsync resolves in every case, finished or cut short by user input or a newer flight, so awaiting it does not tell you the camera arrived. The flight's finish runs from inside the scene's for-of walk of _beforeRender and splices the array, so in the frame a flight ends the next callback in the list is skipped once; the shared driver used by the arc-rotate transition avoids this on purpose"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "controls lifetime: not tied to the scene"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {any: [{pattern: "onSceneDispose($$$)"}, {pattern: "$S._disposables.push($$$)"}]}}' src/camera'''
shows = "registrations with the scene's dispose machinery from the camera directory: none"
count = 0

[[row]]
name = "controls lifetime: disposeScene empties the per-frame list"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "$C._beforeRender.length = 0", inside: {kind: function_declaration, has: {field: name, regex: "^disposeScene$"}, stopBy: end}}}' src/scene'''
shows = "disposeScene truncating the per-frame callback list"
count = 1

[[row]]
name = "controls lifetime: what it means"
is = "attachControl, attachFreeControl, attachConfigurableFreeControl and attachGeospatialControls add listeners to the canvas and a hook to the scene, and return a cleanup function. disposeScene drops the hook but never sees the canvas listeners, which keep firing into a camera that no longer renders. Call the returned cleanup yourself, or pass it to onSceneDispose(scene, cleanup). Without a scene argument, the arc-rotate and free controls collect input but never apply it: there is no requestAnimationFrame fallback"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

