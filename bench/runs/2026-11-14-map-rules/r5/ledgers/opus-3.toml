count = 1

[[row]]
name = "arc keyboard: attachControl calls it optionally"
run = '''ast-grep scan --inline-rules '{id: k, language: TypeScript, rule: {pattern: "_arcRotateKeyboardFactory?.($$$)", inside: {kind: function_declaration, has: {field: name, regex: "^attachControl$"}, stopBy: end}}}' src/camera'''
shows = "attachControl calling the module-level keyboard factory through optional chaining"
count = 1

[[row]]
name = "arc keyboard: what it means"
is = "Passing { keyboard: true } to attachControl does nothing unless enableArcRotateKeyboardControls() was called first, anywhere in the process: the factory slot is empty and the optional call is skipped with no warning. The opt-in exists so pointer-only bundles carry no keyboard code. Call it once, before attachControl; a camera attached earlier does not pick it up"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

