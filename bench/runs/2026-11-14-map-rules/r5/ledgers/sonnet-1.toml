# Ledger for src/camera

[[row]]
name = "camera-contract-shape"
is = "Every camera in this directory is plain data that satisfies the Camera interface in camera.ts: it carries its own view, projection and view-projection matrix caches plus version stamps, and the free functions in camera.ts (getViewMatrix, getProjectionMatrix, getViewProjectionMatrix) fill those caches. The camera objects have no methods for this. Outside this directory, xr-camera.ts and shadow-base.ts also build camera objects with these cache properties. A camera type you add, or a hand-rolled object, must supply the caches and a worldMatrixVersion that never decreases"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "camera-caches-allocated-by-factory-arc-free-geo"
run = "ast-grep scan --inline-rules '{id: x, language: ts, rule: {kind: pair, all: [{has: {field: key, regex: \"^_(view|proj|vp)Cache$\"}}, {has: {field: value, pattern: \"allocateMat4() as unknown as Mat4Storage\"}}]}}' src/camera"
shows = "the three cache properties (view, projection, view-projection) in each object literal that allocates them from allocateMat4, one match per property"
count = 9

[[row]]
name = "camera-banked-reuses-free-factory"
run = "ast-grep run -l ts -p '_createFreeCamera($$$)' src"
shows = "the calls to the internal free-camera factory"
count = 2

[[row]]
name = "projection-change-key-polls-fov-near-far"
run = "ast-grep run -l ts -p '$C._projFov !== $C.fov || $C._projNear !== $C.nearPlane || $C._projFar !== $C.farPlane' src"
shows = "the condition comparing the three remembered projection values with the live fov, nearPlane and farPlane"

