[[row]]
name = "controls-note"
is = "The attach functions return a cleanup function, and none of them is tied to the scene's lifetime: disposing the scene does not remove canvas listeners, so keep the cleanup and call it. The per-frame work (inertia for arc-rotate, movement for free and geospatial) runs from the scene's _beforeRender list, and the arc-rotate, free and configurable-free controls register it only if a scene was passed, so without a scene arc-rotate has no inertia. attachGeospatialControls cannot work without a scene. Moving the camera by other means, such as interpolateArcRotateCamera or flyGeospatialCameraToAsync, also runs as a per-frame callback and needs the scene"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
