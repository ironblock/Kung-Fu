[[row]]
name = "projection-internals-not-in-index"
run = "rg -n -e _cameraChangeKey -e _applyCameraViewport -e _installOrthographicProjector -e FULL_VIEWPORT src/index.ts"
shows = "lines of src/index.ts that name an internal camera helper"
count = 0

[[row]]
name = "projection-change-key-note"
is = "_cameraChangeKey is how everything outside this directory learns that a view volume changed. fov, nearPlane and farPlane are plain fields, so nothing is told when they are written; the key compares them with a remembered copy each time it is called and bumps _projRev on a difference. Orthographic bounds go the other way: their setters bump _projRev directly. The key is worldMatrixVersion plus _projRev, kept apart from the world matrix version on purpose so a projection change does not look like camera motion. A first call always bumps it, because the remembered values start undefined, and scene-core makes the next call bump again by clearing _projFov when it flips the floating-origin flag. Code that keeps its own copy of a camera's matrices should key on _cameraChangeKey, not on worldMatrixVersion"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

