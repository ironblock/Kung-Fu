[[row]]
name = "arc-opt-in-note"
is = "Two parts of the arc-rotate camera are off until you opt in, and both are fixed per process. Limits do nothing until setCameraLimits is called, which installs the hook the alpha, beta and radius setters call after every change; the limit fields alone clamp nothing. Keyboard input works only if enableArcRotateKeyboardControls ran before attachControl: attachControl calls the factory with optional chaining, so without it the keyboard option is silently ignored. The scene argument of setCameraLimits is accepted and unused"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

