count = 3

[[row]]
name = "ortho-bounds-assigned-in-enable-and-disable"
run = "ast-grep run -l ts -p '$C.ortho = $V' src"
shows = "assignments to a camera's ortho field anywhere in src, both in orthographic.ts"
count = 2

[[row]]
name = "ortho-note"
is = "Orthographic mode is a feature module layered on any camera, not a camera type. enableOrthographicCamera registers the writer with camera.ts and sets camera.ortho; if nothing calls it, the writer stays null and the orthographic branch in getProjectionMatrix is dead code a bundler can drop. In orthographic mode fov is ignored, depth still comes from nearPlane and farPlane, and zoom is halfHeight. Switching back must zero three cells of the projection cache by hand, because the perspective writer only sets the cells it needs"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "righthanded-mirror-sites"
run = "ast-grep run -l ts -p 'if (_rightHanded !== null) $B' src/camera"
shows = "the blocks that mirror a matrix for right-handed mode, in camera.ts and in each of the three camera factories"
count = 4

[[row]]
name = "righthanded-note"
is = "Cameras compute everything in Lite's left-handed space and mirror at the edges when the build is right-handed. The view matrix flips its Z terms in getViewMatrix, each factory flips the local world matrix, and the control modules negate yaw and the sideways step so dragging feels the same. Code that adds a camera type or a control module has to do the same mirroring, or it will behave inverted in right-handed builds"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

