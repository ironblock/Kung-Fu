run = "ast-grep scan --inline-rules '{id: x, language: ts, rule: {pattern: \"$P[$I] = 0\", inside: {kind: function_declaration, has: {field: name, regex: \"^disableOrthographicCamera$\"}, stopBy: end}}}' src"
