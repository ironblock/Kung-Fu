[[row]]
name = "viewport-apply-has-no-clamp"
run = "ast-grep scan --inline-rules '{id: x, language: ts, rule: {any: [{pattern: \"Math.min($$$)\"}, {pattern: \"Math.max($$$)\"}], inside: {kind: function_declaration, has: {field: name, regex: \"^_applyCameraViewport$\"}, stopBy: end}}}' src/camera/camera.ts"
shows = "Math.min or Math.max calls inside _applyCameraViewport"
count = 0

[[row]]
name = "viewport-note"
is = "A normalized viewport (y from the bottom, as in Babylon) is turned into pixels in two places. _applyCameraViewport in camera.ts is what render passes use and does not clamp, so a viewport reaching outside 0 to 1 produces an out-of-range viewport and scissor. resolveCameraViewport in viewport.ts clamps and is what picking and gizmo code use to map pointer positions. A viewport that is not within 0 to 1 therefore draws and picks differently. getEffectiveAspectRatio scales the aspect by the viewport's width over height, and every aspect passed to getProjectionMatrix should come through it"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

