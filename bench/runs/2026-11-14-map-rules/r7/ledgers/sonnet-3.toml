[[row]]
name = "MAX_LIGHTS and LIGHT_ENTRY_FLOATS definition"
run = "rg -n -e \"^export (let|const) (MAX_LIGHTS|LIGHT_ENTRY_FLOATS)\" src/light"
shows = "declarations of the scene-wide light cap and the UBO entry size, defined together in the light types file"
count = 2

[[row]]
name = "setMaxLights definition"
run = "rg -n -e \"^export function setMaxLights\" src"
shows = "declaration of the setter that changes MAX_LIGHTS; MAX_LIGHTS is a live binding, so importers see the new value"
count = 1

[[row]]
name = "setMaxLights callers outside light"
run = "rg -n -e \"setMaxLights\\(\" src --glob '!src/light/**' --glob '!src/index.ts'"
shows = "calls that raise the light cap outside src/light, made by the glTF KHR_lights_punctual loader"
count = 1

[[row]]
name = "MAX_LIGHTS importers outside light"
run = "rg -l -e \"import \\{[^}]*MAX_LIGHTS[^}]*\\} from \\\"[./]*/light/types\" src --glob '!src/light/**'"
shows = "files outside src/light that bake the light cap into layouts or WGSL, so the cap must be set before they run"
count = 23

[[row]]
name = "LIGHT_ENTRY_FLOATS users outside light"
run = "rg -l -e LIGHT_ENTRY_FLOATS src --glob '!src/light/**'"
shows = "files outside src/light that index the shared lights UBO by entry stride"
count = 2

[[row]]
name = "light entry writers"
