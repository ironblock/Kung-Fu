[[row]]
name = "handedness: view matrix mirrors four Z entries when right-handed"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {pattern: \"$V[$I] = -$V[$I]!;\", inside: {kind: if_statement, stopBy: end, has: {field: condition, regex: \"_rightHanded !== null\"}}}}' src/camera/camera.ts"
shows = "the negated view matrix entries inside the right-handed branch"
count = 4

[[row]]
name = "handedness: each factory flips six world-matrix entries when right-handed"
