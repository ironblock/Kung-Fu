[[row]]
name = "change key: projection caches key on it"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {pattern: \"const ver = _cameraChangeKey(camera);\", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: \"^get(View)?ProjectionMatrix$\"}}}}' src/camera"
shows = "the version each projection and view-projection cache is compared against"
count = 2

[[row]]
name = "change key: view cache keys on worldMatrixVersion alone"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {pattern: \"const ver = camera.worldMatrixVersion;\", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: \"^getViewMatrix$\"}}}}' src/camera"
shows = "the version the view matrix cache is compared against"
count = 1

[[row]]
name = "change key: sum of world version and projection revision"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {pattern: \"return camera.worldMatrixVersion + (camera._projRev ?? 0);\", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: \"^_cameraChangeKey$\"}}}}' src/camera"
shows = "the return statement of the change key"
count = 1

[[row]]
name = "change key: fov, nearPlane and farPlane are polled by value"
run = "ast-grep run -p 'camera._projFov !== camera.fov || camera._projNear !== camera.nearPlane || camera._projFar !== camera.farPlane' -l ts src/camera"
shows = "the drift test over the three plain fields"
count = 1

[[row]]
name = "change key: projection revision is bumped in two places only"
run = "ast-grep run -p 'camera._projRev = $X' -l ts src"
shows = "assignments to a camera's projection revision, in camera.ts and orthographic.ts"
count = 2

[[row]]
name = "change key: floating-origin flag is set by one writer outside camera"
run = "ast-grep run -p '$C._useFloatingOrigin = $V' -l ts src"
shows = "the only assignment of the floating-origin flag in src"
count = 1

[[row]]
name = "change key: that writer also clears the projection snapshot"
run = "ast-grep run -p '$C._projFov = undefined' -l ts src"
shows = "the reset that makes the next change-key call bump the revision"
count = 1

[[row]]
name = "floating origin: view translation is zeroed from the flag"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {pattern: \"const $C = useFO ? 0 : $W[$I]!;\", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: \"^getViewMatrix$\"}}}}' src/camera"
shows = "the three camera-position terms of the view matrix, each forced to 0 under the flag"
count = 3

[[row]]
name = "orthographic: projector installed from enableOrthographicCamera"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {pattern: \"_installOrthographicProjector(writeOrthoProjection)\", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: \"^enableOrthographicCamera$\"}}}}' src/camera"
shows = "the install call inside the enable function"
count = 1

[[row]]
name = "orthographic: projector installed nowhere else in src"
run = "ast-grep run -p '_installOrthographicProjector($X)' -l ts src"
shows = "every call of the installer in src"
count = 1

[[row]]
name = "orthographic: projection branch needs the projector and camera.ortho"
run = "ast-grep run -p 'if (_orthoProjector !== null && camera.ortho) { $$$A } else { $$$B }' -l ts src/camera/camera.ts"
shows = "the branch in getProjectionMatrix with its perspective fallback"
count = 1

[[row]]
name = "orthographic: camera.ts imports orthographic.ts for types only"
run = "ast-grep scan --inline-rules '{id: r, language: ts, rule: {kind: import_statement, regex: \"orthographic[.]js\", not: {regex: \"^import type\"}}}' src/camera/camera.ts"
shows = "value imports of the orthographic module from camera.ts"
count = 0

[[row]]
name = "orthographic: bound setters invalidate the projection"
