[[row]]
name = "frame-order-1-head"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"$S._beforeRender.unshift($C)\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^onBeforeRender$\"}, \"stopBy\": \"end\"}}}' src"
shows = "places inside onBeforeRender where a user callback is put at the head of the scene's per-frame list"
count = 1

[[row]]
name = "frame-order-2-camera-tail"
run = "ast-grep run -l ts -p '$S._beforeRender.unshift($$$)' src/camera"
shows = "places in the camera directory that put a per-frame callback at the head of that list; camera modules only append"
count = 0

[[row]]
name = "frame-order-3-walk"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"for (const $CB of ctx._beforeRender) { $CB($D); }\", \"inside\": {\"kind\": \"method_definition\", \"has\": {\"field\": \"name\", \"regex\": \"^_update$\"}, \"stopBy\": \"end\"}}}' src"
shows = "loops in the scene's _update method that call each per-frame callback from the first entry to the last, so user callbacks run before camera inertia in the same frame"
count = 1

[[row]]
name = "attach-scene-optional"
run = "ast-grep run -l ts -p 'if (scene) { scene._beforeRender.push($F); }' src/camera"
shows = "control attachers (arc-rotate and both free-camera ones) that register their per-frame update only when a scene argument was passed; without one, inertia and key movement never run"
count = 3

[[row]]
name = "attach-dispose-keeps-listeners"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"any\": [{\"pattern\": \"$X.removeEventListener($$$)\"}, {\"pattern\": \"$X?.removeEventListener($$$)\"}, {\"pattern\": \"$X[$K]($$$)\", \"regex\": \"removeEventListener\"}]}}' src/scene"
shows = "calls in the scene directory that remove a DOM event listener; disposing a scene does not by itself detach camera control listeners from the canvas"
count = 0

[[row]]
name = "attach-geo-keys-on-window"
run = "ast-grep run -l ts -p '[window, $E, $H]' src/camera"
shows = "listener entries in the geospatial controls bound to the window rather than the canvas, so its keyboard input is page-wide"
count = 2

[[row]]
name = "arc-limits-1-setter-hook"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"cam._clampToLimits?.()\", \"inside\": {\"pattern\": \"for (const key of [\\\"alpha\\\", \\\"beta\\\", \\\"radius\\\"] as const) { $$$ }\", \"stopBy\": \"end\"}}}' src/camera"
shows = "calls of the optional clamp hook made by the alpha/beta/radius accessors, so every write to those three is clamped on the spot"
count = 1

[[row]]
name = "arc-limits-2-only-setCameraLimits"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"any\": [{\"pattern\": \"$X._clampToLimits = $Y\"}, {\"kind\": \"pair\", \"has\": {\"field\": \"key\", \"regex\": \"^_clampToLimits$\"}}], \"not\": {\"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^setCameraLimits$\"}, \"stopBy\": \"end\"}}}}' src"
shows = "writes of the clamp hook anywhere outside setCameraLimits; a limit field assigned by hand is not enforced until setCameraLimits has run once on that camera"
count = 0

[[row]]
name = "arc-beta-hard-clamp"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"camera.beta = Math.max($E, Math.min(Math.PI - $E, camera.beta))\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^applyInertia$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "clamps in the arc-rotate inertia step that keep beta a hundredth of a radian off both poles whether or not limits are set"
count = 1

[[row]]
name = "arc-kb-1-only-enable"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"_installArcRotateKeyboardControls($$$)\", \"not\": {\"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^enableArcRotateKeyboardControls$\"}, \"stopBy\": \"end\"}}}}' src"
shows = "calls that install the arc-rotate keyboard factory from anywhere but enableArcRotateKeyboardControls"
count = 0

[[row]]
name = "arc-kb-2-read-at-attach"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"kind\": \"variable_declarator\", \"has\": {\"field\": \"value\", \"pattern\": \"_arcRotateKeyboardFactory?.($C, $V, $O)\"}, \"inside\": {\"kind\": \"lexical_declaration\", \"inside\": {\"kind\": \"statement_block\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^attachControl$\"}}}}}}' src/camera"
shows = "reads of the keyboard factory made directly in attachControl's body, once at attach time, so the enable call has to come before attachControl"
count = 1

[[row]]
name = "arc-interp-1-runner"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"return runFrameInterpolation(scene, step, signal)\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^interpolateArcRotateCamera$\"}, \"stopBy\": \"end\"}}}' src"
shows = "returns in interpolateArcRotateCamera that hand its per-frame step to the shared frame-interpolation runner"
count = 1

[[row]]
name = "arc-interp-2-throws"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"kind\": \"throw_statement\", \"inside\": {\"kind\": \"if_statement\", \"has\": {\"field\": \"condition\", \"has\": {\"pattern\": \"camera.alpha !== lastAlpha\", \"stopBy\": \"end\"}}, \"stopBy\": \"end\"}}}' src/camera"
shows = "throws in the interpolation step guarded by a check of the camera's alpha against the value the step last wrote, so an outside pose change between frames cancels the transition"
count = 1

[[row]]
name = "arc-interp-3-rejects"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"all\": [{\"pattern\": \"reject(toError($E))\"}, {\"inside\": {\"kind\": \"catch_clause\", \"stopBy\": \"end\"}}, {\"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^runFrameInterpolation$\"}, \"stopBy\": \"end\"}}]}}' src/animation"
shows = "rejections in a catch block of the frame-interpolation runner, which turn a throwing step into a rejected promise"
count = 1

[[row]]
name = "geo-fly-1-cancels-previous"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"camera._cancelFly?.()\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^flyGeospatialCameraToAsync$\"}, \"stopBy\": \"end\"}}}' src"
shows = "calls in flyGeospatialCameraToAsync that end a flight already in progress before starting a new one"
count = 1

[[row]]
name = "geo-fly-2-input-cancels"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"if (hasInput && camera._cancelFly) { camera._cancelFly(); }\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^onBeforeRenderTick$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "guards in the geospatial controls' per-frame tick that end a flight on any frame with accumulated user input"
count = 1

[[row]]
name = "geo-fly-3-never-rejects"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"new Promise<void>(($R) => $B)\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^flyGeospatialCameraToAsync$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "promise executors in flyGeospatialCameraToAsync that take only a resolve parameter, so an interrupted flight resolves where an interrupted arc-rotate interpolation rejects"
count = 1

[[row]]
name = "geo-fly-4-end-from-driver"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"finish()\", \"inside\": {\"kind\": \"variable_declarator\", \"has\": {\"field\": \"name\", \"regex\": \"^driver$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "calls of the flight's finish function made from inside its own per-frame driver, that is, while the scene is walking its callback list"
count = 1

[[row]]
name = "geo-fly-5-end-splices"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"$S._beforeRender.splice($I, 1)\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^finish$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "splices of the scene's per-frame list inside a finish function in the camera directory, which shorten that list while the scene is walking it"
count = 1

[[row]]
name = "geo-orient-setters"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"applyOrientation($$$)\", \"inside\": {\"kind\": \"method_definition\", \"has\": {\"field\": \"name\", \"regex\": \"^(center|yaw|pitch|radius)$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "accessors for center, yaw, pitch and radius that each rebuild the whole orientation (with limits clamped) in one call"
count = 4

[[row]]
name = "geo-orient-center-plain"
run = "ast-grep scan --inline-rules '{\"id\": \"r\", \"language\": \"ts\", \"rule\": {\"pattern\": \"const center: Vec3 = { x: $A, y: $B, z: $C }\", \"inside\": {\"kind\": \"function_declaration\", \"has\": {\"field\": \"name\", \"regex\": \"^createGeospatialCamera$\"}, \"stopBy\": \"end\"}}}' src/camera"
shows = "declarations in createGeospatialCamera of the center as a plain object literal, not an observable vector, so writing camera.center.x alone does not re-orbit; assign camera.center"
count = 1

[[row]]
name = "geo-pick-1-aspect"
