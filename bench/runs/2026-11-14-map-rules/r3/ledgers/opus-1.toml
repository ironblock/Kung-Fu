# Ledger for src/camera of Babylon Lite 1.39.0.
# Cameras are plain data objects built by factories (createArcRotateCamera, createFreeCamera,
# createBankedFreeCamera, createGeospatialCamera); behaviour lives in standalone functions that
# read and write those fields (attach*Control, setCameraLimits, interpolate*, fly*, enable*).

# ---- Matrix caches and the projection change key (camera.ts) ----

[[row]]
name = "change-key: projection caches"
run = '''ast-grep scan --inline-rules '{id: change-key-proj, language: TypeScript, rule: {pattern: "const ver = _cameraChangeKey(camera)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^(getProjectionMatrix|getViewProjectionMatrix)$"}}}}' src'''
shows = "the version that getProjectionMatrix and getViewProjectionMatrix key their caches on: the projection change key, not the transform version alone"
count = 2

[[row]]
name = "change-key: view cache ignores it"
run = '''ast-grep scan --inline-rules '{id: change-key-view, language: TypeScript, rule: {pattern: "_cameraChangeKey($$$)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^getViewMatrix$"}}}}' src'''
shows = "uses of the projection change key inside getViewMatrix, whose cache is keyed on worldMatrixVersion only"
count = 0

[[row]]
name = "change-key: polls fov, near and far"
run = '''ast-grep scan --inline-rules '{id: change-key-poll, language: TypeScript, rule: {pattern: "if ($C._projFov !== $C.fov || $C._projNear !== $C.nearPlane || $C._projFar !== $C.farPlane) { $$$ }", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^_cameraChangeKey$"}}}}' src'''
shows = "the by-value comparison inside _cameraChangeKey through which plain writes to the three perspective fields reach the change key"
count = 1

[[row]]
name = "change-key: projection revision bumps"
run = '''ast-grep scan --inline-rules '{id: projrev-bump, language: TypeScript, rule: {pattern: "$C._projRev = ($C._projRev ?? 0) + 1", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^(_cameraChangeKey|invalidateProjection)$"}}}}' src'''
shows = "the projection-revision increments: one in _cameraChangeKey (perspective fields polled) and one in the orthographic module's invalidateProjection (bounds pushed)"
count = 2

[[row]]
name = "change-key: no other bump"
run = '''ast-grep scan --inline-rules '{id: projrev-other, language: TypeScript, rule: {any: [{pattern: "$X._projRev++"}, {pattern: "++$X._projRev"}, {pattern: "$X._projRev += $V"}, {pattern: "$X._projRev = $E + $N"}], not: {inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^(_cameraChangeKey|invalidateProjection)$"}}}}}' src'''
shows = "increments of a projection revision anywhere in src outside those two functions"
count = 0

# ---- Orthographic projection is an opt-in seam ----

[[row]]
name = "ortho-seam: installed by enable"
run = '''ast-grep scan --inline-rules '{id: ortho-install, language: TypeScript, rule: {pattern: "_installOrthographicProjector($F)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^enableOrthographicCamera$"}}}}' src'''
shows = "the call that installs the orthographic projector, made from enableOrthographicCamera"
count = 1

[[row]]
name = "ortho-seam: installed nowhere else"
run = '''ast-grep scan --inline-rules '{id: ortho-install-other, language: TypeScript, rule: {pattern: "_installOrthographicProjector($$$)", not: {inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^enableOrthographicCamera$"}}}}}' src'''
shows = "calls that install the orthographic projector from anywhere else in src"
count = 0

[[row]]
name = "ortho-seam: needs projector and ortho field"
run = '''ast-grep scan --inline-rules '{id: ortho-branch, language: TypeScript, rule: {pattern: "if (_orthoProjector !== null && camera.ortho) { $$$ } else { $$$ }", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^getProjectionMatrix$"}}}}' src'''
shows = "the branch in getProjectionMatrix that projects orthographically only when the projector was installed AND the camera has ortho bounds, so setting camera.ortho by hand in a process that never ran enableOrthographicCamera stays perspective"
count = 1

[[row]]
name = "ortho-disable: clears off-center terms"
run = '''ast-grep scan --inline-rules '{id: ortho-clear, language: TypeScript, rule: {any: [{pattern: "$P[12] = 0"}, {pattern: "$P[13] = 0"}, {pattern: "$P[15] = 0"}], inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^disableOrthographicCamera$"}}}}' src'''
shows = "the projection-cache entries disableOrthographicCamera zeroes by hand: the translation and w terms an orthographic matrix sets"
count = 3

[[row]]
name = "ortho-disable: perspective writer leaves them"
run = '''ast-grep scan --inline-rules '{id: persp-writes, language: TypeScript, rule: {any: [{pattern: "$O[12] = $V"}, {pattern: "$O[13] = $V"}, {pattern: "$O[15] = $V"}], inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^writePerspectiveMat4LHIntoBuffer$"}}}}' src'''
shows = "writes by the perspective writer to those same entries, which is why switching back must clear them first"
count = 0

[[row]]
name = "ortho-bounds: every setter invalidates"
run = '''ast-grep scan --inline-rules '{id: ortho-setters, language: TypeScript, rule: {kind: method_definition, regex: "^set", not: {has: {pattern: "invalidateProjection(camera)", stopBy: end}}}}' src/camera/orthographic.ts'''
shows = "setters on the live ortho bounds object that do not bump the projection revision"
count = 0

# ---- Floating origin (large worlds) ----

[[row]]
name = "floating-origin: one writer"
run = '''ast-grep scan --inline-rules '{id: fo-writer, language: TypeScript, rule: {pattern: "$C._useFloatingOrigin = $V", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^syncCameraFloatingOrigin$"}}}}' src'''
shows = "the assignment of the camera's floating-origin flag, made by the scene's syncCameraFloatingOrigin"
count = 1

[[row]]
name = "floating-origin: no other writer"
run = '''ast-grep scan --inline-rules '{id: fo-other, language: TypeScript, rule: {any: [{pattern: "$C._useFloatingOrigin = $V"}, {kind: pair, has: {field: key, regex: "^_useFloatingOrigin$"}}], not: {inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^syncCameraFloatingOrigin$"}}}}}' src'''
shows = "assignments or object-literal fields setting the floating-origin flag anywhere else in src, camera factories included"
count = 0

[[row]]
name = "floating-origin: synced before the frame hooks"
run = '''ast-grep scan --inline-rules '{id: fo-before, language: TypeScript, rule: {pattern: "syncCameraFloatingOrigin($$$);", precedes: {stopBy: end, pattern: "for (const $C of ctx._beforeRender) { $$$ }"}}}' src'''
shows = "the sync call placed before the loop over the per-frame hooks"
count = 1

[[row]]
name = "floating-origin: synced again after the frame hooks"
run = '''ast-grep scan --inline-rules '{id: fo-after, language: TypeScript, rule: {pattern: "syncCameraFloatingOrigin($$$);", follows: {stopBy: end, pattern: "for (const $C of ctx._beforeRender) { $$$ }"}}}' src'''
shows = "the sync call placed after that loop, so a hook that installs a new scene camera still gets the engine's mode before rendering"
count = 1

# ---- The per-frame hook queue the controls use ----

[[row]]
name = "frame-queue: user hooks go to the head"
run = '''ast-grep scan --inline-rules '{id: queue-head, language: TypeScript, rule: {pattern: "$S._beforeRender.unshift($F)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^onBeforeRender$"}}}}' src'''
shows = "where the public onBeforeRender puts a callback: at the head of the scene's per-frame list"
count = 1

[[row]]
name = "frame-queue: camera drivers go to the tail"
run = '''ast-grep scan --inline-rules '{id: queue-tail, language: TypeScript, rule: {pattern: "scene._beforeRender.push($F)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^(attachControl|attachFreeControl|attachConfigurableFreeControl|attachGeospatialControls|flyGeospatialCameraToAsync)$"}}}}' src/camera'''
shows = "the per-frame drivers of the five camera control and flight functions, each appended at the tail, so onBeforeRender callbacks run before camera inertia in the same frame"
count = 5

[[row]]
name = "frame-queue: optional scene means no per-frame work"
run = '''ast-grep scan --inline-rules '{id: scene-optional, language: TypeScript, rule: {pattern: "if (scene) { scene._beforeRender.push($F); }", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^(attachControl|attachFreeControl|attachConfigurableFreeControl)$"}}}}' src/camera'''
shows = "the guards in the arc-rotate and both free-camera attach functions: without a scene argument their per-frame hook is never registered"
count = 3

[[row]]
name = "frame-queue: free-camera keys move only per frame"
run = '''ast-grep scan --inline-rules '{id: free-move, language: TypeScript, rule: {pattern: "camera.position.x += $E", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^update$"}}}}' src/camera'''
shows = "the free-camera position moves, each inside the per-frame update hook of its attach function, so keyboard movement needs the scene argument"
count = 2

[[row]]
name = "frame-queue: not tied to scene disposal"
run = '''ast-grep run -p 'onSceneDispose($$$)' src/camera'''
shows = "camera code that registers its cleanup for scene disposal; the canvas listeners outlive disposeScene unless the caller calls the returned detach function"
count = 0

# ---- Arc-rotate keyboard is a second opt-in seam ----

[[row]]
name = "arc-keyboard: installed by enable"
run = '''ast-grep scan --inline-rules '{id: kb-install, language: TypeScript, rule: {pattern: "_installArcRotateKeyboardControls($F)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^enableArcRotateKeyboardControls$"}}}}' src'''
shows = "the call that installs the arc-rotate keyboard factory, from enableArcRotateKeyboardControls; until it runs, attachControl's keyboard option is ignored"
count = 1

[[row]]
name = "arc-keyboard: installed nowhere else"
run = '''ast-grep scan --inline-rules '{id: kb-install-other, language: TypeScript, rule: {pattern: "_installArcRotateKeyboardControls($$$)", not: {inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^enableArcRotateKeyboardControls$"}}}}}' src'''
shows = "calls that install the keyboard factory from anywhere else in src"
count = 0

[[row]]
name = "arc-keyboard: applied first in the inertia step"
run = '''ast-grep scan --inline-rules '{id: kb-first, language: TypeScript, rule: {pattern: "keyboardAttachment?.[0]();", nthChild: 1, inside: {kind: statement_block, inside: {kind: function_declaration, has: {field: name, regex: "^applyInertia$"}}}}}' src/camera'''
shows = "the keyboard input step as the first statement of the per-frame inertia function, so held keys add to the inertial offsets that same frame (and only when a scene drives that function)"
count = 1

# ---- Arc-rotate limits ----

[[row]]
name = "arc-limits: hook set only by setCameraLimits"
run = '''ast-grep scan --inline-rules '{id: clamp-hook-other, language: TypeScript, rule: {any: [{pattern: "$C._clampToLimits = $V"}, {kind: pair, has: {field: key, regex: "^_clampToLimits$"}}], not: {inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^setCameraLimits$"}}}}}' src'''
shows = "places outside setCameraLimits that install or clear the self-clamp hook"
count = 0

[[row]]
name = "arc-limits: hook called by the orbit setters"
run = '''ast-grep scan --inline-rules '{id: clamp-hook-call, language: TypeScript, rule: {pattern: "cam._clampToLimits?.()", all: [{inside: {kind: pair, stopBy: end, has: {field: key, regex: "^set$"}}}, {inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^createArcRotateCamera$"}}}]}}' src'''
shows = "the self-clamp call inside the alpha/beta/radius property setters the factory defines, so limits apply on every write once setCameraLimits has run"
count = 1

[[row]]
name = "arc-limits: attachControl reads no limit"
run = '''ast-grep scan --inline-rules '{id: loop-limits, language: TypeScript, rule: {kind: property_identifier, regex: "Limit(s)?$", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^attachControl$"}}}}' src/camera'''
shows = "references to limit fields inside attachControl: writing camera.lowerRadiusLimit by hand without ever calling setCameraLimits clamps nothing"
count = 0

[[row]]
name = "arc-limits: fixed beta band in the inertia step"
run = '''ast-grep scan --inline-rules '{id: beta-band, language: TypeScript, rule: {pattern: "camera.beta = Math.max($E, Math.min(Math.PI - $E, camera.beta))", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^applyInertia$"}}}}' src/camera'''
shows = "the hard beta clamp the inertia step applies whatever the configured limits are, keeping the eye off the poles; it runs only when rotation inertia is non-zero"
count = 1

# ---- Arc-rotate interpolation ----

[[row]]
name = "arc-interpolate: goals clamped to live limits"
run = '''ast-grep scan --inline-rules '{id: interp-clamp, language: TypeScript, rule: {pattern: "clampToLimit($G, camera.$L, camera.$U)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^interpolateArcRotateCamera$"}}}}' src/camera'''
shows = "the per-frame clamps of the alpha, beta and radius goals to the camera's current limit fields"
count = 3

[[row]]
name = "arc-interpolate: drops leftover inertia"
run = '''ast-grep scan --inline-rules '{id: interp-inertia, language: TypeScript, rule: {pattern: "camera.$F = 0", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^interpolateArcRotateCamera$"}}}}' src/camera'''
shows = "the zeroing of every inertial offset on the interpolation's first frame"
count = 5

[[row]]
name = "arc-interpolate: rejects when interrupted"
run = '''ast-grep scan --inline-rules '{id: interp-throw, language: TypeScript, rule: {pattern: "throw new Error($M)", inside: {kind: if_statement, stopBy: end, inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^interpolateArcRotateCamera$"}}}}}' src/camera'''
shows = "the throw in the frame step when the pose differs from what the interpolation last wrote (user input, inertia, another interpolation); runFrameInterpolation turns a throw into a rejected promise"
count = 1

# ---- Geospatial flight ----

[[row]]
name = "geo-fly: never rejects"
run = '''ast-grep scan --inline-rules '{id: fly-promise, language: TypeScript, rule: {pattern: "new Promise<void>((resolve) => { $$$ })", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^flyGeospatialCameraToAsync$"}}}}' src/camera'''
shows = "the flight's promise executor, which takes no reject, so an interrupted flight resolves just as a finished one does, unlike interpolateArcRotateCamera"
count = 1

[[row]]
name = "geo-fly: cancelled by input and by the next flight"
run = '''ast-grep scan --inline-rules '{id: fly-cancel, language: TypeScript, rule: {any: [{pattern: "camera._cancelFly?.()", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^flyGeospatialCameraToAsync$"}}}, {pattern: "camera._cancelFly()", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^onBeforeRenderTick$"}}}]}}' src/camera'''
shows = "the two calls that cut a flight short: a new flight cancels the old one, and the geospatial controls' frame tick cancels it when input has accumulated"
count = 2

[[row]]
name = "geo-fly: removes itself by splice"
run = '''ast-grep scan --inline-rules '{id: fly-splice, language: TypeScript, rule: {pattern: "scene._beforeRender.splice($I, 1)", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^finish$"}}}}' src/camera/geospatial-camera-fly.ts'''
shows = "the flight's finish removing its driver by shortening the per-frame list, the pattern runFrameInterpolation avoids because the list is walked live"
count = 1

[[row]]
name = "geo-fly: finishes from inside its driver"
run = '''ast-grep scan --inline-rules '{id: fly-finish-in-driver, language: TypeScript, rule: {pattern: "finish()", inside: {kind: variable_declarator, stopBy: end, has: {field: name, regex: "^driver$"}}}}' src/camera/geospatial-camera-fly.ts'''
shows = "the finish call made from within the per-frame driver, that is, during the scene's walk of that list"
count = 1

# ---- Geospatial camera state ----

[[row]]
name = "geo-state: setters recompute the pose"
run = '''ast-grep scan --inline-rules '{id: geo-setters, language: TypeScript, rule: {kind: method_definition, regex: "^set (center|yaw|pitch|radius)\\b", has: {pattern: "applyOrientation($$$)", stopBy: end}, inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^createGeospatialCamera$"}}}}' src/camera'''
shows = "the four orientation setters, each routing through applyOrientation, which clamps to limits and rebuilds position and up"
count = 4

[[row]]
name = "geo-state: center getter hands out the internal vector"
run = '''ast-grep scan --inline-rules '{id: geo-center-get, language: TypeScript, rule: {kind: method_definition, regex: "^get center\\(\\)", has: {pattern: "return center;", stopBy: end}, inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^createGeospatialCamera$"}}}}' src/camera'''
shows = "the getter that returns the camera's own plain center object, so writing camera.center.x bypasses the setter and recomputes nothing; assign a whole vector or call setGeospatialOrientation"
count = 1

[[row]]
name = "geo-state: keyboard listens on window"
run = '''ast-grep run -p '[window, $EV, $H]' src/camera'''
shows = "the geospatial controls' key listeners, registered on the window rather than the canvas, so they react to keys pressed anywhere on the page"
count = 2

# ---- Handedness ----

[[row]]
name = "handedness: build-time import only"
run = '''ast-grep scan --inline-rules '{id: rh-path, language: TypeScript, rule: {kind: string, regex: "coordinate-system", not: {regex: "^.#coordinate-system.$"}, inside: {kind: import_statement}}}' src'''
shows = "imports of the handedness module by a file path instead of the #coordinate-system alias that the bundler resolves per build"
count = 0

[[row]]
name = "handedness: every camera factory flips its basis"
run = '''ast-grep scan --inline-rules '{id: rh-flip, language: TypeScript, rule: {pattern: "for (const i of [0, 1, 2, 8, 9, 10]) { $$$ }", inside: {kind: function_declaration, stopBy: end, has: {field: name, regex: "^(createArcRotateCamera|_createFreeCamera|createGeospatialCamera)$"}}}}' src/camera'''
shows = "the right-handed basis flip in each of the three local-matrix builders; a new camera factory has to repeat it"
count = 3

# ---- What src/camera needs from the rest of src ----

[[row]]
name = "deps: scene is only a type, except world matrices"
run = '''ast-grep scan --inline-rules '{id: scene-runtime, language: TypeScript, rule: {kind: import_statement, not: {regex: "^import type"}, has: {kind: string, regex: "scene/", not: {regex: "world-matrix-state"}}}}' src/camera'''
shows = "runtime imports from the scene directory other than the world-matrix state module"
count = 0
