[[row]]
name = "ubo-type-tag"
run = "ast-grep run -l ts -p 'data[o + 3] = $V' src/light"
shows = "one write of the light type tag into slot 3 of the UBO entry per light factory"
count = 5

[[row]]
name = "ubo-writer-only-in-factories"
run = '''ast-grep scan --inline-rules '{id: r, language: ts, rule: {kind: pair, regex: "^_writeLightUbo"}}' src'''
shows = "every definition of a light's UBO writer in src, all in light files"
count = 5

[[row]]
name = "ubo-writer-not-in-clustered"
run = "rg -n -F _writeLightUbo src/light/clustered.ts src/light/clustered-spot-support.ts"
shows = "uses of the UBO writer in the clustered light files"
count = 0

[[row]]
name = "ubo-pack-consumer"
run = "ast-grep run -l ts -p 'light._writeLightUbo(data, headerFloats + count * LIGHT_ENTRY_FLOATS)' src/render"
shows = "the scene lights UBO call that writes each light at a 16-float stride"
count = 1

[[row]]
name = "ubo-pack-cap"
run = "ast-grep run -l ts -p 'if (count >= MAX_LIGHTS) { $$$ }' src/render/scene-lights-ubo.ts"
shows = "the packing loop stopping at the light cap"
count = 1

[[row]]
name = "ubo-pack-skip-unwritable"
run = "ast-grep run -l ts -p 'if (!light._writeLightUbo) { continue; }' src/render/scene-lights-ubo.ts"
shows = "the packing loop skipping lights with no UBO writer, before they take a slot"
count = 1

[[row]]
name = "ubo-pack-rederived-in-light"
run = "ast-grep run -l ts -p 'packed++ < MAX_LIGHTS' src/light"
shows = "places in light that count packed lights again with the same skip-then-cap rule"
count = 2

[[row]]
name = "ubo-fo-offset-not-in-light"
run = "ast-grep run -l ts -p '$E._applyLightFoOffset?.($$$)' src/light"
shows = "calls of the floating-origin light offset from light files"
count = 0

[[row]]
name = "ubo-fo-offset-in-scene-lights-ubo"
run = "ast-grep run -l ts -p '$E._applyLightFoOffset?.($$$)' src/render/scene-lights-ubo.ts"
shows = "the calls that apply the camera offset to the packed lights data"
count = 3

[[row]]
name = "light-cap-assigned-once"
run = "ast-grep run -l ts -p 'MAX_LIGHTS = $V' src"
shows = "assignments to the light cap anywhere in src, inside setMaxLights"
count = 1

[[row]]
name = "light-cap-setter-caller"
run = '''ast-grep run -l ts -p 'setMaxLights($$$)' src'''
shows = "calls to setMaxLights in src, all in the glTF punctual-lights loader"
count = 1

[[row]]
name = "light-cap-read-at-module-load"
run = '''ast-grep scan --inline-rules '{id: r, language: ts, rule: {kind: lexical_declaration, regex: MAX_LIGHTS, inside: {kind: program, stopBy: neighbor}}}' src/material/node/node-shadow-emitter.ts'''
shows = "top-level constants that bake the cap in when the module is first evaluated"
count = 2

[[row]]
name = "light-factories-base"
run = "ast-grep run -l ts -p 'createLightBase($$$)' src/light"
shows = "one createLightBase call per light factory"
count = 5

[[row]]
name = "light-factories-apply"
run = "ast-grep run -l ts -p 'applyLightBase<$T>($$$)' src/light"
shows = "one applyLightBase call per light factory"
count = 5

[[row]]
name = "light-factories-clone"
run = "ast-grep run -l ts -p 'copyBase(light, clone)' src/light"
shows = "one copy of shared light state per factory clone hook"
count = 5

[[row]]
name = "light-clone-copier-only-in-scene"
run = "ast-grep run -l ts -p 'import { copyLightBase } from $S' src"
shows = "static imports of the shared light copier, all in scene code"
count = 1

[[row]]
name = "light-base-not-imported-outside"
run = '''ast-grep scan --inline-rules '{id: r, language: ts, rule: {kind: import_statement, regex: "light/light-base"}}' src'''
shows = "imports of the shared light base from outside light"
count = 0

[[row]]
name = "light-base-version-getter"
run = "ast-grep run -l ts -p 'Object.defineProperty(node, \"_lightVersion\", $O)' src/light/light-base.ts"
shows = "the version property defined as a getter on the node"
count = 1

[[row]]
name = "light-version-bump-in-setters"
run = "ast-grep run -l ts -p 'light._bumpLightVersion?.()' src/light/set-light-diffuse-color.ts src/light/set-light-intensity.ts"
