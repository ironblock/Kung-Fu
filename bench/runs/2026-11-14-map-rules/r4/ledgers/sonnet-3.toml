count = 1

[[row]]
name = "light-lazy-gltf"
run = '''ast-grep scan --inline-rules '{id: r, language: ts, rule: {kind: call_expression, regex: "^import.*light/(point|spot)-light"}}' src/loader-gltf/gltf-feature-lights-punctual.ts'''
shows = "dynamic imports of the point and spot light factories in the glTF loader"
count = 2

[[row]]
name = "light-lazy-no-static-import"
run = '''ast-grep scan --inline-rules '{id: r, language: ts, rule: {kind: import_statement, regex: "light/(point|spot)-light[.]js", not: {regex: "^import type"}}}' src'''
shows = "value imports of the point and spot light factories, anywhere in src"
count = 0

[[row]]
name = "rect-validate-defined-once"
