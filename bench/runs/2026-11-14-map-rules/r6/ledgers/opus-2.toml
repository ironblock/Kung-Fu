[[row]]
name = "rect area: order of calls"
is = "To use a RectAreaLight: create it; if it is textured, first await processAreaLightTexture(engine, source), which installs the emission code, and assign the result to emissionTexture; then await enableRectAreaLights(scene), which fetches the LTC tables over the network, loads the PBR and Standard rect-area fragments by dynamic import and sets scene._lighting; then register the scene, whose buildScene validates each light. A raw texture in emissionTexture, a shadowGenerator on the light, or a NodeMaterial with lighting blocks all throw. Changing emissionTexture needs enableRectAreaLights and a rebuild again"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

