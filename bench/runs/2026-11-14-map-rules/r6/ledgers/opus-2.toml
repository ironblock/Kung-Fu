[[row]]
name = "rect area: textured light refused without the seam"
run = '''ast-grep scan --inline-rules '{id: v, language: ts, rule: {pattern: "throw new Error($M)", inside: {pattern: "if (!prepareEmission) { $$$ }", stopBy: end}}}' src/light'''
