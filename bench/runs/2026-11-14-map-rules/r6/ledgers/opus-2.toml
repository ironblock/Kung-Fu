[[row]]
name = "light version: what a plain write misses"
is = "The scene rewrites its lights UBO only when the summed _lightVersion, the light-list version or the light count changes. On point, directional, spot and hemispheric lights, intensity, diffuse, specular, range, exponent and groundColor are plain fields, so writing them, or an element of their arrays, changes no version and the GPU keeps the old values until something else moves the sum. position and direction are ObservableVec3s and do bump it, spot's angle setter bumps it, and every RectAreaLight field bumps it itself. After a plain write call setLightIntensity, setLightDiffuseColor, or light._bumpLightVersion()"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

