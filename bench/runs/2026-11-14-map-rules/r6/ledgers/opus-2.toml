[[row]]
name = "clustered: how to use it"
is = "Clustered lights are plain records in a ClusteredLightContainer, not scene nodes: they are not in scene.lights, do not count against MAX_LIGHTS, cannot cast shadows and shade only PBR materials. Create every light before addClusteredLightContainer, which builds GPU textures sized for the lights present then and hands the state only to materials on meshes already in the scene. Position, colour, range, intensity, direction and angle are read straight from the records, so after editing one call markClusteredLightContainerDirty. Creating any spot light switches the whole container to a wider 3-texel layout and a separate PBR shader path"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]
