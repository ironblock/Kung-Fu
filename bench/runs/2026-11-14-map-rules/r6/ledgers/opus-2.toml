[[row]]
name = "light UBO entry: type code"
run = '''ast-grep scan --inline-rules '{id: type-code, language: ts, rule: {pattern: "$D[$O + 3] = $N", inside: {kind: pair, has: {field: key, regex: "^_writeLightUbo$"}, stopBy: end}}, constraints: {N: {regex: "^[0-4]$"}}}' src'''
shows = "the type codes 0 to 4 that each light writer puts in slot 3 of its UBO entry, one code per writer file"
count = 5

[[row]]
name = "light UBO entry: size"
run = "ast-grep run -l ts -p 'export const LIGHT_ENTRY_FLOATS = 16' src"
shows = "the one declaration of the number of floats in a light UBO entry"

[[row]]
name = "light UBO entry: packing walks"
run = "ast-grep run -l ts -p 'if (!$L._writeLightUbo) { continue; }' src"
shows = "the loops over scene lights that skip a light with no _writeLightUbo, in the UBO filler, the floating-origin pass, mesh light selection and the PBR and rect-area material code"
count = 6

[[row]]
name = "light UBO entry: cap"
run = "ast-grep run -l ts -p 'if ($C >= MAX_LIGHTS) { break; }' src"
shows = "the loops over scene lights that stop once MAX_LIGHTS lights are counted"
count = 4

[[row]]
name = "light UBO entry: floating origin skips direction-only codes"
run = "ast-grep run -l ts -p '$T !== 1 && $T !== 3' src/large-world"
shows = "the one test in the floating-origin code that leaves entries with type code 1 or 3 alone"

[[row]]
name = "light UBO entry: what the codes mean"
is = "A light reaches the shader only through its 16-float entry in the scene's shared lights UBO. Entries are packed in scene.lights order, skipping lights without _writeLightUbo, and the list is cut at MAX_LIGHTS; every loop above recomputes the packed index the same way, so a change to the skip or cap rule in one must be made in all. The code in slot 3 is read by the shaders as u32(vLightData.w): 0 point, 1 directional, 2 spot, 3 hemispheric, 4 rectArea. Codes 1 and 3 hold a direction in slots 0-2; every other code holds a world position there, which the floating-origin pass overwrites with a camera-relative one. A new light type must pick an unused code and, if it has a position, not 1 or 3. Hemispheric reuses slots 12-14 for its ground colour and rectArea packs its half-extent axes into slots 7 and 11-15"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

