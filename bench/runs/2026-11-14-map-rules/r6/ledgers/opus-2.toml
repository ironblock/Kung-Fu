[[row]]
name = "light clone: filters are shared"
run = "ast-grep run -l ts -p '$C.$F = $S.$F' src/light/light-clone.ts"
shows = "the fields copyLightBase sets straight from the same field of the source, among them the four mesh filter sets"
count = 6

[[row]]
name = "light clone: what carries over"
is = "cloneTransformNode calls the light's own _cloneNode, which builds a new light from the source's constructor arguments, copies its colour arrays and then runs copyLightBase. The clone gets fresh position, rotation and scaling values and a copy of any local matrix, but the very same filter Set objects as the source, and no shadowGenerator: a cloned light casts no shadow until one is attached"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "MAX_LIGHTS: mutable"
run = "ast-grep run -l ts -p 'export let MAX_LIGHTS = 16' src"
shows = "the one declaration of MAX_LIGHTS, a let with default 16"

[[row]]
name = "MAX_LIGHTS: raised by the glTF loader"
run = "ast-grep run -l ts -p 'setMaxLights($X)' src"
shows = "the one call to setMaxLights in the library, in the glTF punctual-lights feature"

[[row]]
name = "MAX_LIGHTS: when to set it"
is = "MAX_LIGHTS is read each time a shader text or the lights UBO is built; the WGSL lights arrays are sized from it. ensureSceneLightState makes a new buffer when the size changes, but pipelines already compiled keep the old array length, so setMaxLights belongs before any scene is built or asset loaded. Lights past the cap stay in scene.lights and light nothing, and nothing reports it"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

