count = 1

[[row]]
name = "clustered: note"
is = "Clustered lights do not go in scene.lights and have no _writeLightUbo. They live in a ClusteredLightContainer added with addClusteredLightContainer, which registers the point-light PBR extension and builds its own GPU textures. Spot code sits in clustered-spot-support.ts and is attached only when createClusteredSpotLight is used, so point-only scenes do not ship it. clustered.ts and clustered-spot-support.ts import types from each other"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]
