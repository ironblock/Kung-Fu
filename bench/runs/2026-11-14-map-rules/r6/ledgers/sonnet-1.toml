[[row]]
name = "light kinds: clone hook"
run = "ast-grep scan --inline-rules '{\"id\":\"c\",\"language\":\"ts\",\"rule\":{\"kind\":\"property_identifier\",\"regex\":\"^_cloneNode$\",\"inside\":{\"kind\":\"pair\"}}}' src/light"
shows = "the _cloneNode properties set on light objects, one per factory"
count = 5

[[row]]
name = "light kinds: note"
is = "Each factory (point 0, directional 1, spot 2, hemispheric 3, rectArea 4) is a plain function that builds a SceneNode with createLightBase, merges its fields with applyLightBase, and supplies its own _writeLightUbo and _cloneNode. The scene decides something is a light only by the presence of a lightType key, and every material reads the same 16-float entry, so a new kind needs a new, unused type code in slot 3 plus matching WGSL in the material directory. Hemispheric, directional and spot also keep a direction that goes through the world matrix"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
