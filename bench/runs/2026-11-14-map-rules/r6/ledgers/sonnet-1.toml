name = "light kinds: UBO type code"
run = "ast-grep scan --inline-rules '{\"id\":\"t\",\"language\":\"ts\",\"rule\":{\"pattern\":\"$D[$O + 3] = $V\",\"inside\":{\"kind\":\"pair\",\"stopBy\":\"end\",\"has\":{\"field\":\"key\",\"regex\":\"^_writeLightUbo$\"}}}}' src/light"
shows = "the one assignment per light factory that writes its type code into slot 3 of its UBO entry"
count = 5

