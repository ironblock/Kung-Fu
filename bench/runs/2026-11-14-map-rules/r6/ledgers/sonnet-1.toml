[[row]]
name = "rect area emission: note"
is = "Order for a rect area light: createRectAreaLight is scene-free; enableRectAreaLights(scene) must be awaited before the scene is registered, and it only then sets scene._lighting, which scene-core hands to each light's _validateLighting. A textured light needs processAreaLightTexture(engine, source) first. That call is what installs the emission preparer, so enabling lights without ever calling it throws if a packed light has an emissionTexture. Solid-colour scenes never load the emission code. Shadows on rect area lights are rejected"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "lights cap: single assignment"
run = "ast-grep scan --inline-rules '{\"id\":\"m\",\"language\":\"ts\",\"rule\":{\"pattern\":\"MAX_LIGHTS = $V\",\"inside\":{\"kind\":\"function_declaration\",\"stopBy\":\"end\",\"has\":{\"field\":\"name\",\"regex\":\"^setMaxLights$\"}}}}' src"
shows = "the only assignment to MAX_LIGHTS in the tree, inside setMaxLights"
count = 1

[[row]]
name = "lights cap: wide check"
run = "ast-grep run -p 'MAX_LIGHTS = $V' -l ts src"
shows = "every assignment to MAX_LIGHTS in the tree"
count = 1

[[row]]
name = "lights cap: note"
is = "MAX_LIGHTS is an exported mutable binding, scene-wide, not per material. setMaxLights changes it for later shader and UBO builds only, so it must be called before pipelines are compiled; the glTF loader calls it when an asset declares more lights. Rect area code counts only the first MAX_LIGHTS packed lights when it decides whether any has an emission texture"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

