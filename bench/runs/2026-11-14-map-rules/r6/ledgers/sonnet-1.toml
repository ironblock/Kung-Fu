[[row]]
name = "light version: redefinition"
run = "ast-grep run -p 'Object.defineProperty($L, \"_lightVersion\", $$$)' -l ts src"
shows = "the places that define the _lightVersion property on a light, one in light/ and one in the glTF loader"
count = 2

[[row]]
name = "light version: note"
is = "A light's version is the sum of its own counter and its world-matrix version, and the scene's lights UBO is refreshed when the sum over all lights changes. Writes to position, rotation and direction notify on their own. Plain scalar and array fields (intensity, diffuse, range, specular) do not on point, directional, spot and hemispheric lights, so code that mutates them must call setLightIntensity, setLightDiffuseColor or _bumpLightVersion itself or the UBO goes stale. RectAreaLight is the exception: it wraps width, height, intensity, diffuse, specular and emissionTexture in accessors that bump the version"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

