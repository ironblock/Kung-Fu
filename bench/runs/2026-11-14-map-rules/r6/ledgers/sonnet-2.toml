[[row]]
name = "light clustered lifecycle"
is = "Clustered lights are plain data in container.pointLights and container.spotLights, handled separately from scene lights. Create every light before addClusteredLightContainer(scene, container): that call builds GPU state that bakes the capacity and, if any spot light exists, the spot data layout (createClusteredSpotLight is what switches the container to the spot layout, so point-only bundles stay smaller). Editing a light in place does not bump the container version; call markClusteredLightContainerDirty afterwards. addClusteredLightContainer registers only the PBR extension and sets _clusteredLightState on materials of meshes already in the scene, so Standard materials do not shade these lights and meshes added later do not pick up the state through this call"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

