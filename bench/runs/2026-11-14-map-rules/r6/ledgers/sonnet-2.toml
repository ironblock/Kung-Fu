[[row]]
name = "light layout"
is = "src/light holds three separate things. (1) Five scene-graph light types (point, directional, spot, hemispheric, rectArea), each a factory returning plain SceneNode data built from light-base.ts, with shared types and the MAX_LIGHTS cap in types.ts. (2) A clustered light container, which is not a light node and never enters scene.lights. (3) Rect-area-light support: LTC tables, optional emission-texture preprocessing, and the scene lighting extension, split across about ten area-light-* and enable/process files so that scenes with no rect lights do not load them. Most of the directory's imports into material/, resource/ and texture/ come from group 3 and the clustered container; the five light factories import only light-base, types and math/scene types"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "light factory base"
run = "ast-grep run -p 'applyLightBase<$T>($$$A)' -l ts src/light"
shows = "the factory calls that build a light from the shared base, one in each of the five light types"
count = 5

