[[row]]
name = "max lights timing"
is = "MAX_LIGHTS is an ES live binding, but consumers read it when they build: node-shadow-emitter.ts turns it into WGSL text at module load, and the UBO size and shader loops follow it. setMaxLights must therefore run before any scene is built or any pipeline compiled. The glTF loader raises it itself when an asset declares more lights than the cap. Lights past the cap are skipped silently when packing (render/scene-lights-ubo.ts stops at the cap)"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

