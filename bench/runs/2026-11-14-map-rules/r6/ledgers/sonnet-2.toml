[[row]]
name = "light change tracking"
is = "Only some writes notify. Position, rotation and direction are watched (direction is an ObservableVec3 wired to the version bump), and RectAreaLight also watches width, height, intensity, emissionTexture, and element writes into diffuse and specular. On point, directional, spot and hemispheric lights, intensity, diffuse, specular, range, exponent and the colour arrays are plain fields: writing them directly does not bump the version, so the lights UBO is not re-uploaded until something else bumps it. Use setLightIntensity or setLightDiffuseColor, or call light._bumpLightVersion?.() after a direct write. setLightDiffuseColor is typed for a light with a diffuse field, so it does not fit HemisphericLight. Spot angle is the exception that does notify, through a defineProperty setter that also recomputes the cached cosine written to float 15"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

