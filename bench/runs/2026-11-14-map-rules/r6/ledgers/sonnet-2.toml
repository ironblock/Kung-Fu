[[row]]
name = "rect area sequence"
is = "Rect lights need explicit setup. Order: createRectAreaLight, then optionally processAreaLightTexture(engine, source) and assign the returned texture to light.emissionTexture, then await enableRectAreaLights(scene) before the scene is registered, then the scene boots and buildScene calls each light's _validateLighting, which throws if no lighting extension with a rectArea single-light source is set or if the light has a shadowGenerator. enableRectAreaLights throws if any packed light has an emissionTexture and processAreaLightTexture was never called, because the emission preparer is only installed by processAreaLightTexture after it succeeds, so merely importing the module is not enough. The preparer then loads area-light-emission-setup only when a packed light has an emission texture; otherwise it clears emission state. Setup is repeatable: the extension's _prepare calls enableRectAreaLights again, and the PBR scene hook re-runs it for scenes that already own LTC tables. Material fragments in material/pbr and material/standard import area-light-ltc, area-light-wgsl and the emission files back from here, so this directory and those fragments depend on each other in both directions, and the dynamic imports in enable-rect-area-lights.ts are what keep that out of scenes that never use rect lights"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

