[[row]]
name = "light clone split"
is = "A light clones itself in two steps: its own _cloneNode builds a new light through its factory and copies its type-specific fields, then calls the copier it was handed to copy name, transform, visibility, metadata and the four include/exclude mesh filters. cloneTransformNode in scene/transform-node.ts supplies that copier from light-clone.ts, which is kept out of light-base.ts so that scene core does not pull light-base into the entry chunk of scenes whose lights load lazily. The clone does not copy shadowGenerator, and the copier renames it source.name + '_clone'"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

