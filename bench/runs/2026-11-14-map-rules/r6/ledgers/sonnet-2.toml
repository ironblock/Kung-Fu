[[row]]
name = "light ubo type numbers"
is = "The five _writeLightUbo bodies tag their 64-byte entry with a type number in float 3: point 0, directional 1, spot 2, hemispheric 3, rectArea 4. Material shaders read that number to decide how to shade, so a new light type needs a new number and shader support in material/pbr and material/standard, not just a factory here. Entry size is LIGHT_ENTRY_FLOATS (16 floats) and the lights UBO is sized from MAX_LIGHTS in render/scene-lights-ubo.ts. Positions are written in raw world space; the floating-origin offset is applied later by large-world code"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

