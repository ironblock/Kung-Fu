[[row]]
name = "clustered-apart"
is = "Clustered lights are a separate system from the LightBase lights. They are plain position/colour records in a container, never put in scene.lights and never given _writeLightUbo, so MAX_LIGHTS and the shared lights UBO do not apply to them. A container is attached to a scene by addClusteredLightContainer, which also resets _renderFeatures on every mesh material already in the scene. Edits to a clustered light's fields are not noticed: call markClusteredLightContainerDirty afterwards. Spot support is installed on the first createClusteredSpotLight call for a container, not on creation"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]
