[[row]]
name = "lights-ubo-contract"
is = "A light is packed into the shared lights UBO only if it has _writeLightUbo. Each factory writes a 16-float entry at the offset it is given and puts its type tag in slot 3 of the entry: point 0, directional 1, spot 2, hemispheric 3, rectArea 4. The single caller is scene-lights-ubo.ts, which starts entries after a 4-float header (the count) and stops at MAX_LIGHTS. A factory that writes slot 3 differently from the other four, or a sixth light kind, needs the shader side of PBR and Standard materials changed with it, because they read the tag from that slot"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

