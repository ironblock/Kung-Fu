[[row]]
name = "light-clone-and-base-split"
is = "cloneTransformNode in scene/transform-node.ts is the only importer of light-clone.ts, and passes copyLightBase into each light's _cloneNode. The copier is kept apart from light-base.ts so scene code never imports light-base statically; each factory's _cloneNode builds a fresh light (so lvs and the accessors are new) and only then calls the copier for name, transform, visibility, metadata and the four mesh filters. Anything a new light type adds to its own state has to be copied in its _cloneNode, not in copyLightBase"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

