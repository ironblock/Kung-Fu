[[row]]
name = "rect-area-setup-order"
is = "Rect area lights are set up in three steps that must come in this order. processAreaLightTexture (only if an emission image is wanted) installs the emission hook into enable-rect-area-lights as a side effect of finishing. enableRectAreaLights(scene) then loads the LTC tables and fragments, registers the PBR and Standard extensions, builds the lighting object on scene._lighting and, if the hook is installed, lets area-light-emission-setup replace its _single, _multi, _pbrFeatures and _standard. buildScene finally calls each light's _validateLighting, which throws if the lighting object has no rectArea source. With no processed texture the emission code is never loaded; and if no processed texture has ever been made in this module, enable throws for a packed rect light that has an emissionTexture. The enable function is re-run through lighting._prepare, so it must be safe to call again"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

