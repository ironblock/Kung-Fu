[[row]]
name = "light-version-tracking"
is = "Every light shares one LightVersionState; its b() bumps a counter, and the _lightVersion that scene-lights-ubo sums is that counter plus the node's worldMatrixVersion. Position and direction notify through ObservableVec3 given lvs.b. Plain fields on point, directional and hemispheric lights (intensity, diffuse, specular, range) do not notify when written directly, so setLightIntensity and setLightDiffuseColor exist to write and then call _bumpLightVersion. Spot angle and the rect area width, height, intensity, diffuse, specular and emissionTexture are accessors that bump on their own. The glTF loader wraps _lightVersion again to add its own counter"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

