# Ledger for src/light of Babylon Lite 1.39.0.
# Five scene lights (point, directional, spot, hemispheric, rectArea) share one scene-wide
# lights UBO; clustered point/spot lights are a separate, PBR-only system in clustered.ts.

[[row]]
name = "light type code: written by each factory"
run = "ast-grep scan --inline-rules '{id: type-code, language: TypeScript, rule: {pattern: \"$D[$O + 3] = $N\", inside: {kind: pair, has: {field: key, regex: ^_writeLightUbo$}, stopBy: end}}}' src"
shows = "the write to float 3 of the light's 16-float entry inside each light's _writeLightUbo, one per light file, with the number that file writes"
count = 5

[[row]]
name = "light type code: meaning"
is = "Float 3 of each 16-float UBO entry is the light kind, read in WGSL as u32(vLightData.w): 0 point, 1 directional, 2 spot, 3 hemispheric, 4 rectArea. PBR, Standard and Node materials each branch on this number in their own WGSL text under src/material, so a new light kind needs a new number and a branch in every one of them. The other 15 floats mean different things per kind: rectArea puts its world half-width vector in diffuse.w, specular.w and direction.x, and its half-height vector in direction.yzw"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "lights UBO: packing loop"
run = "ast-grep scan --inline-rules '{id: pack, language: TypeScript, rule: {kind: for_in_statement, inside: {kind: function_declaration, has: {field: name, regex: ^fillLightsData$}, stopBy: end}, all: [{has: {pattern: \"$C >= MAX_LIGHTS\", stopBy: end}}, {has: {pattern: \"if (!$L._writeLightUbo) { continue; }\", stopBy: end}}, {has: {pattern: \"$L._writeLightUbo($D, $H + $C * LIGHT_ENTRY_FLOATS)\", stopBy: end}}]}}' src"
shows = "the loop in fillLightsData over scene lights that stops at MAX_LIGHTS, skips a light with no _writeLightUbo, and has each remaining light write its own entry at the next LIGHT_ENTRY_FLOATS slot"

[[row]]
name = "lights UBO: size follows MAX_LIGHTS"
run = "ast-grep run -p '16 + MAX_LIGHTS * LIGHT_ENTRY_FLOATS * 4' src"
shows = "the byte size of the scene lights UBO, computed from the current MAX_LIGHTS"

[[row]]
name = "lights UBO: rewrite condition"
run = "ast-grep run -p 'if ($V !== $S._version || $LV !== $S._listVersion || $SC.lights.length !== $S._lightCount) { $$$ }' src"
shows = "the test in refreshSceneLightsUBO that refills and uploads the lights UBO only when the version sum, the light-list version or the light count changed"

[[row]]
name = "lights UBO: version sum"
run = "ast-grep run -p '$V += $L._lightVersion ?? 0' src"
shows = "the sum over scene lights of each light's _lightVersion"

[[row]]
name = "light version: getter"
run = "ast-grep run -p '$A._lightVersion + $N.worldMatrixVersion' src"
shows = "the _lightVersion getter that applyLightBase installs: the light's own counter plus its node's world-matrix version"

[[row]]
name = "light version: direction vectors bump it"
run = "ast-grep run -p 'new ObservableVec3($X, $Y, $Z, $L.b)' src"
shows = "the direction vectors of the spot, hemispheric and directional lights, each built with the version bump as its change callback"
count = 3

[[row]]
name = "light version: property setters in src/light"
run = "ast-grep scan --inline-rules '{id: setters, language: TypeScript, rule: {any: [{pattern: \"Object.defineProperty($O, $K, $D)\"}, {pattern: \"Reflect.defineProperty($O, $K, $D)\"}, {pattern: \"Object.defineProperties($O, $D)\"}]}}' src/light"
shows = "every property defined with a getter in src/light: the version getter in light-base, the spot cone angle, and the rect area light's size, intensity, colour and emission image setters"
count = 5

[[row]]
name = "light version: explicit bump calls"
run = "ast-grep run -p '$L._bumpLightVersion?.()' src"
shows = "the calls to a light's _bumpLightVersion: in setLightDiffuseColor, setLightIntensity and the glTF light animation"
count = 3

[[row]]
name = "light version: what a plain write misses"
is = "The lights UBO is refilled only when some light's _lightVersion moves (or the light list changes). On point, directional, spot and hemispheric lights the colour arrays, intensity, range and spot exponent are plain fields with no setter, so `light.intensity = 2` or `light.diffuse[0] = 1` reaches the GPU only on some later, unrelated refill. Use setLightIntensity / setLightDiffuseColor, or call `light._bumpLightVersion?.()` after the write. Moving the light (its position, rotation or scaling, or a parent's) and setting direction components or the spot angle do bump. RectAreaLight is the exception: every field has a setter and its colour arrays are Proxies"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "light colour field: interfaces with diffuse"
run = "ast-grep scan --inline-rules '{id: colour, language: TypeScript, rule: {kind: property_signature, has: {field: name, regex: ^diffuse$}, inside: {kind: interface_declaration, has: {kind: extends_type_clause, has: {regex: ^LightBase$}}, stopBy: end}}}' src"
shows = "the field named diffuse in each light interface that extends LightBase, which leaves out the hemispheric light"
count = 4

[[row]]
name = "light colour field: setLightDiffuseColor signature"
run = "ast-grep run -p 'function setLightDiffuseColor($L: LightBase & { diffuse: $T }, $C: $CT): void { $$$ }' src"
shows = "setLightDiffuseColor accepting only a light that has a field named diffuse"

[[row]]
name = "MAX_LIGHTS: assignment"
run = "ast-grep run -p 'MAX_LIGHTS = $X' src"
shows = "the one assignment to MAX_LIGHTS, inside setMaxLights"

[[row]]
name = "MAX_LIGHTS: setMaxLights caller in src"
run = "ast-grep run -p 'setMaxLights($X)' src"
shows = "the one call of setMaxLights inside the library, in the glTF KHR_lights_punctual loader"

[[row]]
name = "MAX_LIGHTS: when to change it"
is = "MAX_LIGHTS (default 16) is one cap for the whole scene, not per material: every material indexes the same group-0 lights UBO, and lights past the cap in scene.lights order are silently left out of shading and of per-mesh light selection. The UBO buffer is reallocated when its size changes, but compiled pipelines and the area-light emission WGSL bake the cap in, so call setMaxLights before building any scene that needs more. loadGltf raises it itself, before addToScene, when an asset declares more punctual lights than the cap; it never lowers it"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "rect area setup: buildScene runs light validators"
run = "ast-grep run -p '$L._validateLighting?.($S._lighting)' src"
shows = "the call in buildScene that hands each light's _validateLighting the scene's lighting extension"

[[row]]
name = "rect area setup: the one validator"
run = "ast-grep scan --inline-rules '{id: validator, language: TypeScript, rule: {any: [{pattern: \"$X._validateLighting = $Y\"}, {kind: pair, has: {field: key, regex: ^_validateLighting$}}]}}' src"
shows = "the one _validateLighting given to any light in src, by createRectAreaLight"

[[row]]
name = "rect area setup: validator checks"
run = "ast-grep scan --inline-rules '{id: checks, language: TypeScript, rule: {any: [{pattern: \"if (!$E?._single?.(\\\"rectArea\\\")) { $$$ }\"}, {pattern: \"if ($L.shadowGenerator) { $$$ }\"}], inside: {kind: pair, has: {field: key, regex: ^_validateLighting$}, stopBy: end}}}' src"
shows = "the two throws in the rect area validator: one when the light has a shadow generator, one when the scene's lighting extension gives no rectArea single-light source"
count = 2

[[row]]
name = "rect area setup: scene._lighting assignment"
run = "ast-grep scan --inline-rules '{id: lighting, language: TypeScript, rule: {any: [{pattern: \"$X._lighting = $Y\"}, {kind: pair, has: {field: key, regex: ^_lighting$}}]}}' src"
shows = "the one place in src that sets a scene's _lighting, at the end of enableRectAreaLights"

[[row]]
name = "rect area setup: lazy imports"
run = "ast-grep scan --inline-rules '{id: lazy, language: TypeScript, rule: {pattern: \"import($P)\", not: {inside: {kind: type_annotation, stopBy: end}}}}' src/light"
shows = "the dynamic imports in src/light outside type annotations: the PBR and Standard rect area fragments in enableRectAreaLights, and the emission setup in process-area-light-texture"
count = 3

[[row]]
name = "rect area setup: LTC tables download"
run = "ast-grep scan --inline-rules '{id: ltc, language: TypeScript, rule: {any: [{pattern: \"const LTC_URL = $U\"}, {pattern: \"fetch(LTC_URL)\"}]}}' src/light"
shows = "the URL of the LTC lookup tables and the fetch that loads them"
count = 2

[[row]]
name = "rect area setup: order"
is = "A RectAreaLight needs `await enableRectAreaLights(scene)` after the light is added and before registerScene: buildScene throws otherwise, because only enableRectAreaLights sets scene._lighting. enableRectAreaLights downloads the 64 KiB LTC tables from assets.babylonjs.com on first use (no offline fallback), lazy-loads the PBR and Standard rect area shader fragments, and registers material extensions globally. Rect area lights cannot cast shadows, and NodeMaterial lighting blocks throw when the scene holds one"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "emission texture: installer call"
run = "ast-grep run -p '_installRectAreaEmission($X)' src"
shows = "the one call that installs the textured emission path, made by processAreaLightTexture"

[[row]]
name = "emission texture: guard in enableRectAreaLights"
run = "ast-grep run -p 'if (!prepareEmission) { $$$ }' src"
shows = "the branch in enableRectAreaLights, taken while no emission path is installed, that throws for a packed rect area light that has an emission image"

[[row]]
name = "emission texture: processor brand"
run = "ast-grep scan --inline-rules '{id: brand, language: TypeScript, rule: {any: [{pattern: \"$X._areaLightImage = $Y\"}, {kind: pair, has: {field: key, regex: ^_areaLightImage$}}]}}' src"
shows = "the one place that sets a texture's _areaLightImage, in processAreaLightTexture's result"

[[row]]
name = "emission texture: order"
is = "An emissionTexture must be the Texture2D returned by `await processAreaLightTexture(engine, source)` on the same device (a 1024x1024 rgba8unorm, 11-mip, blurred copy that the caller owns), never the source itself. The first such call also installs the emission path; without it enableRectAreaLights throws for any textured rect light. Assigning or changing emissionTexture needs another `await enableRectAreaLights(scene)` and a rebuild, and emission preparation throws if the lights or their textures change while it runs"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "clustered version: increments"
run = "ast-grep scan --inline-rules '{id: cver, language: TypeScript, rule: {any: [{pattern: \"$C._version++\"}, {pattern: \"++$C._version\"}, {pattern: \"$C._version += $N\"}, {pattern: \"$C._version = $N\"}]}}' src/light"
shows = "every change to a clustered container's _version in src/light: in createClusteredPointLight, createClusteredSpotLight and markClusteredLightContainerDirty"
count = 3

[[row]]
name = "clustered capacity: GPU state build"
run = "ast-grep run -p 'buildClusteredLightGpuState($$$)' src"
shows = "the one call that builds a container's GPU state, in addClusteredLightContainer"

[[row]]
name = "clustered capacity: growth throw"
run = "ast-grep run -p 'throw new Error(\"ClusteredLightContainer: light count cannot grow after GPU state creation.\")' src"
shows = "the throw in the per-frame refresh when the container holds more lights, or gained spot support, after its GPU state was built"

[[row]]
name = "clustered capacity: camera needed"
run = "ast-grep run -p 'throw new Error(\"buildClusteredLightGpuState: scene.camera is required\")' src"
shows = "the throw when the GPU state is built for a scene with no camera"

[[row]]
name = "clustered wiring: material state set in the mesh loop"
run = "ast-grep scan --inline-rules '{id: wire, language: TypeScript, rule: {pattern: \"for (const $M of $C.meshes) { $$$ }\", has: {pattern: \"$X._clusteredLightState = $S\", stopBy: end}, inside: {kind: function_declaration, has: {field: name, regex: ^addClusteredLightContainer$}, stopBy: end}}}' src"
shows = "the loop in addClusteredLightContainer over the scene's current meshes that gives each mesh's material the container's GPU state"

[[row]]
name = "clustered wiring: no other setter"
run = "ast-grep scan --inline-rules '{id: wire-else, language: TypeScript, rule: {any: [{pattern: \"$X._clusteredLightState = $S\"}, {kind: pair, has: {field: key, regex: ^_clusteredLightState$}}], not: {inside: {pattern: \"for (const $M of $C.meshes) { $$$ }\", stopBy: end}}}}' src"
shows = "any place outside that mesh loop that gives a material a clustered light state"
count = 0

[[row]]
name = "clustered wiring: material kinds"
run = "ast-grep run -p '_registerStdExt($X)' src/light"
shows = "every Standard-material extension registered from src/light, all of them rect area ones"
count = 2

[[row]]
name = "clustered: how to use"
is = "Clustered lights are plain records in a ClusteredLightContainer, not LightBase nodes: they never enter scene.lights, MAX_LIGHTS or the lights UBO, and only PBR materials shade them. Create every light first, set scene.camera, add the meshes with their materials, then call addClusteredLightContainer once: it fixes the light capacity and point/spot layout, and wires only the materials present at that moment. To animate, mutate a light in place and call markClusteredLightContainerDirty; without it the GPU data is not refreshed. A second addClusteredLightContainer rewires the current materials and replaces the per-frame updater; the first container's GPU state is only freed when the scene is disposed"
said = [{ by = "the mapper, from reading the code", on = 2026-11-14 }]

[[row]]
name = "light clone: factories' clone hooks"
run = "ast-grep scan --inline-rules '{id: clone, language: TypeScript, rule: {kind: pair, has: {field: key, regex: ^_cloneNode$}}}' src/light"
shows = "the _cloneNode given by each of the five light factories"
count = 5

[[row]]
name = "light clone: copier passed by cloneTransformNode"
run = "ast-grep run -p '$S._cloneNode?.(copyLightBase)' src"
shows = "the call in cloneTransformNode that hands copyLightBase to a node's _cloneNode"

[[row]]
name = "light clone: fields copied by reference"
run = "ast-grep scan --inline-rules '{id: share, language: TypeScript, rule: {pattern: \"$C.$P = $S.$P\", inside: {kind: function_declaration, has: {field: name, regex: ^copyLightBase$}, stopBy: end}}}' src"
shows = "the fields copyLightBase assigns straight from source to clone: visible, metadata and the four mesh include/exclude sets"
count = 6
